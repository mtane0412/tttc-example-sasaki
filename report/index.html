<!DOCTYPE html><html><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width"/><meta name="next-head-count" content="2"/><link rel="preload" href="./_next/static/css/d1386df84e9d164b.css" as="style" crossorigin=""/><link rel="stylesheet" href="./_next/static/css/d1386df84e9d164b.css" crossorigin="" data-n-g=""/><noscript data-n-css=""></noscript><script defer="" crossorigin="" nomodule="" src="./_next/static/chunks/polyfills-c67a75d1b6f99dc8.js"></script><script src="./_next/static/chunks/webpack-1e7d36e3ced660e3.js" defer="" crossorigin=""></script><script src="./_next/static/chunks/framework-0c7baedefba6b077.js" defer="" crossorigin=""></script><script src="./_next/static/chunks/main-75623049b75f64cc.js" defer="" crossorigin=""></script><script src="./_next/static/chunks/pages/_app-41fcb505e2a6ec3b.js" defer="" crossorigin=""></script><script src="./_next/static/chunks/3e199aef-8a882f67d84a9743.js" defer="" crossorigin=""></script><script src="./_next/static/chunks/413-fe7ad88e9897fb6d.js" defer="" crossorigin=""></script><script src="./_next/static/chunks/664-4ccc24e47970c0fa.js" defer="" crossorigin=""></script><script src="./_next/static/chunks/550-a21c3768867c648a.js" defer="" crossorigin=""></script><script src="./_next/static/chunks/pages/index-cc72100c2afe033d.js" defer="" crossorigin=""></script><script src="./_next/static/-bu7P0zzfzE_B6lszQoPu/_buildManifest.js" defer="" crossorigin=""></script><script src="./_next/static/-bu7P0zzfzE_B6lszQoPu/_ssgManifest.js" defer="" crossorigin=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json" crossorigin="">{"props":{"pageProps":{"result":{"clusters":[{"cluster":"バッテリーの評価","cluster_id":"1","takeaways":"議論の主な論点は、佐々木朗希投手の成長とその背景にある指導者の判断、特に大船渡高校の監督の英断についてです。佐々木朗希が完全試合を達成したことや、彼とバッテリーを組んだ高卒ルーキーの松川捕手の貢献が称賛されています。また、過去の選手の酷使に対する懸念や、若手選手の育成に対する期待も強調されています。全体として、佐々木朗希と松川捕手の将来に対する期待と、彼らを支える指導者の重要性が議論の中心となっています。","arguments":[{"arg_id":"A1_0","argument":"彼は高校時代に監督が投げさせなかったため、甲子園に行けなかった人だよね。それが良かったのかもしれない。","comment_id":"1","x":7.629373,"y":6.7408543,"p":1},{"arg_id":"A1_1","argument":"済美高校の安楽は、めちゃめちゃ連投させて問題になったけど、その後どうなったんだろう？","comment_id":"1","x":7.4136124,"y":6.945285,"p":1},{"arg_id":"A3_1","argument":"投手としてのピークをどこに置くかについては様々な意見があるが、中学生に強いるのは虐待だと思う。","comment_id":"3","x":7.8105865,"y":6.9582357,"p":0},{"arg_id":"A15_0","argument":"甲子園の予選決勝で無理に投げさせていたら、今の活躍はなかったかもしれない。大船渡高校の監督の判断は英断だった。","comment_id":"15","x":7.478312,"y":6.8661523,"p":1},{"arg_id":"A19_0","argument":"夏の県決勝で投げさせなかった監督が偉い。","comment_id":"19","x":7.770158,"y":6.570241,"p":1},{"arg_id":"A30_0","argument":"久しぶりに実家に行った。皆でカードゲームをしている最中、母が急にスマホの通知を見て「ゲーム中に失礼、でもロウキが完全試合！」と叫んだ。労基？野球？と混乱した。母って野球好きだったっけ……。","comment_id":"30","x":7.6563745,"y":7.902864,"p":1},{"arg_id":"A31_0","argument":"松川がここぞでしっかり捕球したのも大きかった。まだ18歳やぞwww","comment_id":"31","x":8.587671,"y":6.8485103,"p":1},{"arg_id":"A36_0","argument":"90年代のロッテだったら、人材不足で1年目から酷使して、今ごろ壊してたと思う。","comment_id":"36","x":8.195083,"y":7.5188956,"p":1},{"arg_id":"A36_2","argument":"千葉ロッテが球界の至宝を育てるとは思わなかった。","comment_id":"36","x":7.6487775,"y":7.263481,"p":0},{"arg_id":"A39_0","argument":"「正直あまり意識していなく、打たれてもいいかなと思いながらキャッチャーの松川を信じて投げた」と話しました。","comment_id":"39","x":8.711321,"y":6.631044,"p":0.6828704901582133},{"arg_id":"A42_0","argument":"有藤「なぜヒーローインタビューに松川を呼ばないのか」","comment_id":"42","x":8.115246,"y":6.6560016,"p":0},{"arg_id":"A53_1","argument":"松川捕手も素晴らしい。","comment_id":"53","x":8.50049,"y":6.4724884,"p":1},{"arg_id":"A59_2","argument":"それはさておき、佐々木選手おめでとうございます。","comment_id":"59","x":7.839585,"y":5.592899,"p":1},{"arg_id":"A61_0","argument":"ヒーローインタビューで捕手の松川を褒め称えていたけど、自分のことももっと語って良いと思った。","comment_id":"61","x":8.60456,"y":6.511173,"p":1},{"arg_id":"A62_0","argument":"バッテリーを組んだ捕手も若く、ロッテの未来は明るい。","comment_id":"62","x":8.684772,"y":7.4211564,"p":0},{"arg_id":"A64_1","argument":"受けた捕手も高卒1年目というのだから凄い。","comment_id":"64","x":8.501554,"y":6.7043066,"p":0.5630455985683176},{"arg_id":"A66_0","argument":"ロッテの育成が成功し、捕手も含めて制球が1年前より大幅に改善された。","comment_id":"66","x":8.226077,"y":7.502942,"p":1},{"arg_id":"A68_0","argument":"佐々木ロウキがすごいのはもちろんですが、松川くんもすごいです。高卒1年目の捕手が開幕スタメンで、しかも完全試合を達成するなんて、二度と現れないレベルですごいです。フレッシュバッテリー最高です👏🏻","comment_id":"68","x":8.557215,"y":6.4033284,"p":1},{"arg_id":"A72_0","argument":"記録よりも、捕手の松川を含めたマリーンズの編成と育成の集大成が素晴らしい。","comment_id":"72","x":8.231229,"y":6.8832946,"p":1},{"arg_id":"A75_0","argument":"捕手の松川が高卒1年目で完全試合を達成し、打撃でも走者一掃の活躍を見せた。","comment_id":"75","x":8.535542,"y":6.879993,"p":1},{"arg_id":"A90_0","argument":"佐々木希に名前が似ているとしか認識していませんでしたが、おめでとうございます。","comment_id":"90","x":7.869211,"y":5.518451,"p":1},{"arg_id":"A93_0","argument":"大船渡の監督とロッテは、佐々木朗希という逸材を潰さなかったことをもっと褒められるべきだ。","comment_id":"93","x":7.868496,"y":6.3787413,"p":1},{"arg_id":"A97_0","argument":"佐々木朗希がここまで理想通りに早く成長するとは思わなかった。","comment_id":"97","x":7.750582,"y":5.9635653,"p":0},{"arg_id":"A97_1","argument":"佐々木世代の高卒ドライチ投手の順調な仕上がりがすごい。","comment_id":"97","x":8.009125,"y":6.1214223,"p":0},{"arg_id":"A99_0","argument":"佐々木希さんと混同することがある。","comment_id":"99","x":7.9988747,"y":5.6758533,"p":0.7074770074559779},{"arg_id":"A99_1","argument":"朝倉未来選手の名前が朝比奈みくるに見えて混同することがある。","comment_id":"99","x":7.620114,"y":6.3312674,"p":0.8747272544906615},{"arg_id":"A102_0","argument":"やきうクラスタではないが、彼の肩と将来を大事にした大船渡の監督も褒めてほしい。","comment_id":"102","x":8.080873,"y":6.241263,"p":0.874339854900673},{"arg_id":"A111_0","argument":"なんでや！ロッテ関係あるやろ！","comment_id":"111","x":7.9733696,"y":7.6753473,"p":0.2637602634592472},{"arg_id":"A111_1","argument":"松川捕手、2週間前まで高校生だったと思えない貫禄。","comment_id":"111","x":8.273847,"y":6.952189,"p":1},{"arg_id":"A118_0","argument":"佐々木はもちろん、キャッチャーも高卒ルーキーの松川なのがすごい。","comment_id":"118","x":8.399664,"y":5.960869,"p":1},{"arg_id":"A118_1","argument":"松川が捕手としてスタメンで試合に出ていたのか。","comment_id":"118","x":8.549513,"y":6.786461,"p":1},{"arg_id":"A121_0","argument":"無理に甲子園を目指さなかった監督の判断は正しかった。","comment_id":"121","x":7.6403728,"y":6.770103,"p":1},{"arg_id":"A131_0","argument":"ダルビッシュや大谷、佐々木朗希を育てたコーチは、いつメジャーから声がかかってもおかしくない。","comment_id":"131","x":7.711347,"y":6.333,"p":1},{"arg_id":"A136_1","argument":"近頃の若い子はすごいね。","comment_id":"136","x":7.438191,"y":5.871472,"p":0},{"arg_id":"A141_0","argument":"千葉マリンだと思ったらやっぱり千葉マリンだった。ちょうど古田、俊介、星野、下柳がマリン風の話をする動画を見たところだった。","comment_id":"141","x":7.4564815,"y":7.832234,"p":1},{"arg_id":"A141_1","argument":"野田の19Kも千葉マリン。ランナーを出さなければ盗塁もされない。","comment_id":"141","x":7.716797,"y":7.566631,"p":1},{"arg_id":"A144_1","argument":"捕手の子も含めてチートレベルだと言われている。","comment_id":"144","x":8.846504,"y":6.4144583,"p":0},{"arg_id":"A150_1","argument":"高校野球（甲子園）という暗黒に飲まれなかったことと、三木谷王国や吉村帝国を回避して吉井の居る海浜幕張へ行けたことが大きい。","comment_id":"150","x":7.449572,"y":6.6788187,"p":1},{"arg_id":"A151_0","argument":"キャッチャーの若さもまた物語性がある。","comment_id":"151","x":8.533755,"y":6.138329,"p":0.9686831975410612},{"arg_id":"A153_2","argument":"佐々木朗希は今後も完全試合を達成する可能性があり、すごい。","comment_id":"153","x":7.9093137,"y":5.887254,"p":0},{"arg_id":"A154_0","argument":"過保護と言われていたが、それが正解だった。","comment_id":"154","x":7.19439,"y":6.916439,"p":1},{"arg_id":"A158_1","argument":"早熟ではないが、大リーグで活躍してほしい。1年目は出場しなかったので、大リーグ行きは遅れるかもしれない。","comment_id":"158","x":8.318889,"y":7.192297,"p":0},{"arg_id":"A166_0","argument":"「キャッチャーがルーキー」というのを称えると玄人っぽい感じがする。","comment_id":"166","x":8.614154,"y":6.0646005,"p":0.9043142198158696},{"arg_id":"A168_1","argument":"マリーンズもバファローズもユニフォームの上が黒、下が白なので注意。","comment_id":"168","x":7.683044,"y":7.577722,"p":1},{"arg_id":"A170_0","argument":"アンガールズの佐々木希はすごい。","comment_id":"170","x":8.111859,"y":5.615001,"p":1},{"arg_id":"A173_2","argument":"ロッテのホームゲームだったんだ。","comment_id":"173","x":8.064477,"y":7.684893,"p":0.3220980104645032},{"arg_id":"A175_1","argument":"吉田正尚を完全に抑えるのは凄いことだ。","comment_id":"175","x":7.2982793,"y":6.8010325,"p":1},{"arg_id":"A177_0","argument":"佐々木希さん、おめでとうございます。","comment_id":"177","x":7.8644295,"y":5.4706225,"p":1},{"arg_id":"A183_0","argument":"ロッテのじっくり育成が大成功し、すごいピッチャーが誕生した。","comment_id":"183","x":8.158442,"y":7.495802,"p":1},{"arg_id":"A190_1","argument":"完投もプロで初めてらしい。この間まで高校生だった捕手も褒めてほしい。","comment_id":"190","x":8.072325,"y":7.0635233,"p":1},{"arg_id":"A192_0","argument":"誤爆で佐々木希がTwitterでトレンド入りした。","comment_id":"192","x":8.021507,"y":5.6060915,"p":1},{"arg_id":"A193_0","argument":"高卒3年目の佐々木と高卒1年目の松川のバッテリーで完全試合を達成。佐々木は「松川を信じて投げました」「松川がいいリードをしてくれた」と称賛。 https://news.livedoor.com/article/detail/21980541/ 泣ける","comment_id":"193","x":8.744306,"y":6.4617505,"p":0.7945842367301084},{"arg_id":"A199_1","argument":"リードしたルーキー松川もすごい。","comment_id":"199","x":8.547414,"y":5.804049,"p":1},{"arg_id":"A201_0","argument":"佐々木もすごい。","comment_id":"201","x":8.168947,"y":5.575739,"p":0.603130348394285},{"arg_id":"A201_1","argument":"高卒ルーキー松川くんの胆力もすごい。","comment_id":"201","x":8.521922,"y":5.828639,"p":1},{"arg_id":"A203_0","argument":"千葉にはロッテマリーンズという球団があることを覚えておいてください。","comment_id":"203","x":7.6317973,"y":7.524796,"p":1}]},{"cluster":"岩手県の誇り","cluster_id":"5","takeaways":"参加者は、岩手県出身の新たな野球選手がMLBに挑戦することに感動と驚きを表明しています。震災からの復興を経て、少子化の中でも優れた人材を輩出し続ける岩手県の特異性に注目し、地域の誇りと喜びを共有しています。","arguments":[{"arg_id":"A2_0","argument":"また岩手出身のすごい野球選手が現れた。","comment_id":"2","x":6.8813095,"y":6.2546663,"p":0.4956826267267599},{"arg_id":"A9_1","argument":"またフィクションが敗北してしまったか。","comment_id":"9","x":6.71357,"y":6.4344997,"p":0.5145705597405579},{"arg_id":"A16_0","argument":"震災でひどく傷つけられた少年が、いろんな人の支えで立派になった。感動した。","comment_id":"16","x":7.0835304,"y":5.701235,"p":0},{"arg_id":"A41_0","argument":"岩手県から3人目の選手がMLBに挑戦する。","comment_id":"41","x":6.868023,"y":5.838374,"p":1},{"arg_id":"A47_0","argument":"岩手には本当に人が少ないのに、どうなっているのか。","comment_id":"47","x":6.6438613,"y":5.5548058,"p":1},{"arg_id":"A55_0","argument":"岩手は少子化の時代にあっても、優れた人材を多く輩出している。","comment_id":"55","x":6.8158073,"y":5.790637,"p":1},{"arg_id":"A60_0","argument":"また岩手。何か特別なDNAでもあるのだろうか？","comment_id":"60","x":6.7182126,"y":5.6364183,"p":1},{"arg_id":"A64_0","argument":"若者の現実離れが凄い。","comment_id":"64","x":7.3459673,"y":5.957824,"p":1},{"arg_id":"A70_0","argument":"「佐々木郎希なんてたいしたことない。岩手県ですらここ10年で3人いるレベルのピッチャー」というコピペ、自分が最初に考えたことにならないかなあw","comment_id":"70","x":7.159163,"y":5.9308643,"p":1},{"arg_id":"A70_1","argument":"岩手県すごすぎ。","comment_id":"70","x":6.580583,"y":5.3605523,"p":1},{"arg_id":"A73_0","argument":"岩手県民として、陸前高田を襲った震災を生き延びたことに感動し、涙が出てきます。おめでとうございます！","comment_id":"73","x":6.876762,"y":5.482785,"p":0},{"arg_id":"A83_0","argument":"玉山鉄二が十数年ぶりに主演映画に出演するらしい。","comment_id":"83","x":6.8327565,"y":5.8620834,"p":1},{"arg_id":"A89_0","argument":"岩手県凄すぎ","comment_id":"89","x":6.7099833,"y":5.4594636,"p":1},{"arg_id":"A104_1","argument":"大谷といい、岩手はすごいな。","comment_id":"104","x":6.470226,"y":5.3162484,"p":0},{"arg_id":"A120_0","argument":"岩手で号外が出るレベルの出来事である。","comment_id":"120","x":6.747548,"y":5.6374784,"p":0.8749412584936209},{"arg_id":"A181_0","argument":"また若者が人間らしさを失っているのか。","comment_id":"181","x":6.6222467,"y":6.0207634,"p":0}]},{"cluster":"歴史的偉業の称賛","cluster_id":"6","takeaways":"この議論は、佐々木朗希投手がプロ野球史上最高のピッチングを見せ、28年ぶりに完全試合を達成したことに関するものです。参加者は、彼のパフォーマンスが大谷翔平を超える可能性があると評価し、試合内容が漫画「MAJOR」の茂野吾郎のようだと例えています。また、キャッチャーの松川選手が高卒ルーキーとして大記録を達成したことも称賛されています。全体として、佐々木投手の偉業に対する驚きと喜びが強調されています。","arguments":[{"arg_id":"A3_0","argument":"個人的には野田の名が残ったことを含めて完全な試合だと思う。","comment_id":"3","x":7.088576,"y":8.569443,"p":1},{"arg_id":"A7_0","argument":"野球は全然わからないけど、この閉塞感の中で明るいニュースがあるのは嬉しい。","comment_id":"7","x":5.315064,"y":8.503794,"p":1},{"arg_id":"A8_0","argument":"千葉テレビは放送しない。","comment_id":"8","x":7.150577,"y":7.3989553,"p":0},{"arg_id":"A10_0","argument":"中日ファンだったので近藤のことを思い出した。","comment_id":"10","x":7.1433773,"y":8.32757,"p":0.8166401180205353},{"arg_id":"A10_1","argument":"完全試合のことは一旦リセットして忘れ、好きなように投げてほしい。","comment_id":"10","x":6.5468063,"y":8.75177,"p":1},{"arg_id":"A11_1","argument":"吉田正尚には三重殺と完全試合の記録もあるのは驚きだ。","comment_id":"11","x":7.356359,"y":8.686065,"p":1},{"arg_id":"A19_1","argument":"見事に結果が出て、もう悪く言われることはないだろう。","comment_id":"19","x":5.988661,"y":7.0442586,"p":0},{"arg_id":"A20_0","argument":"初完投初完封で完全試合ってどういうこと？","comment_id":"20","x":6.368437,"y":9.023874,"p":1},{"arg_id":"A21_1","argument":"この輝きを長く見たい。","comment_id":"21","x":5.9506106,"y":7.444222,"p":1},{"arg_id":"A24_0","argument":"生きているうちにもう一度観られて良かった。槙原も成仏できるし、何よりだ。","comment_id":"24","x":6.181008,"y":7.332367,"p":0.8939906650007113},{"arg_id":"A26_1","argument":"みんなが言うように、この選手は漫画を超えている。","comment_id":"26","x":6.506386,"y":7.784215,"p":0},{"arg_id":"A26_2","argument":"配信で見ていたが、圧巻だった。","comment_id":"26","x":6.1059494,"y":8.045594,"p":1},{"arg_id":"A27_0","argument":"観たかった…。","comment_id":"27","x":6.078293,"y":7.634279,"p":0},{"arg_id":"A28_1","argument":"槙原でリアルタイム感動したおっさんだけど、若い選手が記録を作っていくのは嬉しい。","comment_id":"28","x":5.6960897,"y":7.528419,"p":0.854068208590449},{"arg_id":"A31_1","argument":"すばらしい＼(^o^)／おめでとうございます＼(^o^)／","comment_id":"31","x":5.2623167,"y":6.4289236,"p":0},{"arg_id":"A32_0","argument":"ポスティングしたらMLB各球団はいくら出すのだろうか。","comment_id":"32","x":5.6534004,"y":9.00102,"p":1},{"arg_id":"A34_0","argument":"本当にすごい投球だった。","comment_id":"34","x":5.8861146,"y":8.794327,"p":1},{"arg_id":"A35_0","argument":"漫画「ブ●ゴ」みたいな試合だな…。","comment_id":"35","x":6.718574,"y":8.156129,"p":0.5777506874667581},{"arg_id":"A37_0","argument":"試合内容がまるで『MAJOR』の茂野吾郎のようだ。","comment_id":"37","x":6.994479,"y":8.2617445,"p":0.631381663932551},{"arg_id":"A38_0","argument":"動画を見たが、内容が無茶苦茶だった。","comment_id":"38","x":6.100559,"y":8.034523,"p":1},{"arg_id":"A43_1","argument":"ものすごい生涯成績を残すかもしれない。","comment_id":"43","x":5.963119,"y":6.942413,"p":0},{"arg_id":"A45_0","argument":"投球内容が優れた記録ずくめの完全試合ですごかった。","comment_id":"45","x":6.5670424,"y":8.852644,"p":1},{"arg_id":"A49_0","argument":"まーくんのような選手は二度と出ないと思ったら大谷くんが現れ、大谷くんのような選手は二度と出ないと思ったらこれですよ。","comment_id":"49","x":6.860676,"y":7.1677575,"p":1},{"arg_id":"A53_0","argument":"プロ初完投初完封がこれ…。末恐ろしい。","comment_id":"53","x":6.245972,"y":8.930651,"p":0},{"arg_id":"A54_0","argument":"槙原の完全試合を見ていたので覚えている。","comment_id":"54","x":7.0074835,"y":8.575513,"p":0.8817450178764241},{"arg_id":"A54_2","argument":"観戦していた人は運がいい。","comment_id":"54","x":6.1314015,"y":7.3329067,"p":1},{"arg_id":"A59_0","argument":"野球詳しくないが、ピッチャーが誰も塁に出さないことを「完全試合」と呼ぶのはモヤる。","comment_id":"59","x":6.002006,"y":9.325461,"p":1},{"arg_id":"A59_1","argument":"逆に聞きたいのだが、野球のパーフェクトってそういうこと？","comment_id":"59","x":5.5037174,"y":8.872242,"p":1},{"arg_id":"A62_1","argument":"今日は良いニュースがあって嬉しい。","comment_id":"62","x":5.1135077,"y":8.204119,"p":0.6646176385061031},{"arg_id":"A63_1","argument":"素人なので、今後出てくる色々な解説が楽しみ。","comment_id":"63","x":5.149232,"y":7.5320716,"p":0},{"arg_id":"A65_0","argument":"またマンガを超える記録が出た。他の試合では西武がトリプルプレイを決めたらしい。天気が良くなると野球の質も上がるのかもしれない。ともあれ、おめでとうございます。","comment_id":"65","x":5.918258,"y":8.925841,"p":1},{"arg_id":"A78_1","argument":"完全試合達成者の3/16が佐々木姓である。","comment_id":"78","x":7.6528025,"y":8.41738,"p":0.880229677818699},{"arg_id":"A80_0","argument":"コメントを読むだけでもわくわくして楽しいし、嬉しい。","comment_id":"80","x":5.081143,"y":8.002781,"p":0},{"arg_id":"A81_0","argument":"無茶苦茶だ。大谷翔平が霞んで見える。","comment_id":"81","x":6.4371405,"y":6.9752693,"p":0.5996747021707484},{"arg_id":"A82_0","argument":"ソフトバンクユーザー特典で、ネット中継で最後の方を生で見られた。","comment_id":"82","x":6.097503,"y":8.038452,"p":1},{"arg_id":"A82_1","argument":"パーフェクトと言えば槙原氏の試合も見ていた。長嶋一茂がフライを取るのをビクビクしながら見ていた記憶がある。","comment_id":"82","x":7.0900707,"y":8.449364,"p":1},{"arg_id":"A85_0","argument":"1試合のパフォーマンスとしては日本プロ野球史上最高ではないか？","comment_id":"85","x":5.6789923,"y":8.968332,"p":1},{"arg_id":"A87_0","argument":"吉田の打席でのカーブが印象的だった。","comment_id":"87","x":7.31274,"y":8.475734,"p":0.5929241941574742},{"arg_id":"A91_0","argument":"完全試合、素晴らしいね。","comment_id":"91","x":6.3629403,"y":8.636009,"p":1},{"arg_id":"A92_0","argument":"近藤真一投手も衝撃的だったが、初登板以降は目立たなかった（それでも偉大な記録）。","comment_id":"92","x":7.3990135,"y":7.648398,"p":0.3594461472857365},{"arg_id":"A92_1","argument":"佐々木投手が仮にこの一試合だけだったとしても、伝説に残るには十分である。","comment_id":"92","x":7.5254345,"y":8.045992,"p":0.9439021376238396},{"arg_id":"A96_0","argument":"完全試合が槇原以来で、1試合19Kはフォークお化けの野田以来。","comment_id":"96","x":7.616408,"y":8.79801,"p":1},{"arg_id":"A98_0","argument":"野球のことはわからないが、すごいと思う。","comment_id":"98","x":5.495794,"y":8.76751,"p":1},{"arg_id":"A104_0","argument":"タイムラインに「まだ完全試合が残ってる」って文字が流れて「？？？」となった。","comment_id":"104","x":6.5264325,"y":9.069919,"p":1},{"arg_id":"A105_0","argument":"先発完投するサファテという書き込みを見て、その凄さがわかった。WHIP0.39とか見たことがない。","comment_id":"105","x":6.218218,"y":8.31878,"p":0},{"arg_id":"A109_0","argument":"凄いの一言。彼の野球人生が長く続くことを願う。","comment_id":"109","x":5.649812,"y":8.256852,"p":0.540452614829967},{"arg_id":"A110_0","argument":"野球はよく分からないが、凄いらしいので記念にブックマークした。","comment_id":"110","x":5.3675814,"y":8.548855,"p":0.6883445064280042},{"arg_id":"A113_0","argument":"今日のスポーツニュースはこの人一色でしょう。","comment_id":"113","x":5.2783995,"y":8.373317,"p":1},{"arg_id":"A116_0","argument":"不正行為","comment_id":"116","x":5.9552093,"y":6.646364,"p":0},{"arg_id":"A117_0","argument":"こんなの漫画でも嘘だろって言われちゃう。","comment_id":"117","x":6.4733605,"y":7.7899613,"p":0},{"arg_id":"A122_0","argument":"ノーヒットノーランどころか完全試合とは。それも前年パリーグ覇者のオリックス相手に。凄いけど、それだけ。","comment_id":"122","x":5.9363465,"y":9.522015,"p":1},{"arg_id":"A123_1","argument":"大谷より凄い選手は出ないと思っていたが、投手で本当にとんでもない選手が出てきた。","comment_id":"123","x":6.9846945,"y":7.238275,"p":0.7529014542591046},{"arg_id":"A125_0","argument":"完全試合だけでもすごいのに、さらに多くの記録が加わっているのがすごい。","comment_id":"125","x":6.3085246,"y":8.358375,"p":1},{"arg_id":"A126_0","argument":"転生したら野球選手だった！？２～大谷さんと俺がワールドシリーズで激突するまでの物語～","comment_id":"126","x":6.762321,"y":7.1803637,"p":1},{"arg_id":"A128_0","argument":"YouTubeでまとめを見たけど、全然バットが当たらなかった。後半は当ててきたけど、最後のバッターでまた三振を取った。2001年世代はすごい。","comment_id":"128","x":6.769418,"y":8.931935,"p":0},{"arg_id":"A129_0","argument":"なんちゅうえげつない記録なんだ。","comment_id":"129","x":5.4559474,"y":7.242733,"p":1},{"arg_id":"A133_0","argument":"歴史","comment_id":"133","x":5.4483724,"y":7.062378,"p":0.5285660287100737},{"arg_id":"A134_0","argument":"この時代にこんな大記録が出るとは驚きだ。","comment_id":"134","x":5.5323606,"y":7.097094,"p":0.5197911008275506},{"arg_id":"A135_0","argument":"ちょっとどうかしてる記録が生まれてしまった。いやはや。","comment_id":"135","x":5.4291763,"y":7.2160163,"p":1},{"arg_id":"A136_0","argument":"パTVがまとめ動画をYouTubeに上げるはずなので見なければ。ほんとにおめでとう！","comment_id":"136","x":5.403716,"y":7.856339,"p":0},{"arg_id":"A136_2","argument":"THE FEATURE PLAYER来てた https://www.youtube.com/watch?v=xiunae5qVcE","comment_id":"136","x":5.698314,"y":7.752985,"p":1},{"arg_id":"A139_0","argument":"昭和初の完全試合は藤本英雄（背番号17）である。","comment_id":"139","x":7.802655,"y":8.575708,"p":1},{"arg_id":"A139_1","argument":"平成初（かつ唯一）の完全試合は槙原寛己（背番号17）である。","comment_id":"139","x":7.7346106,"y":8.646786,"p":0.9997406151961332},{"arg_id":"A139_2","argument":"21世紀初・令和初の完全試合は佐々木朗希（背番号17）が達成した。","comment_id":"139","x":7.8829403,"y":8.4288025,"p":1},{"arg_id":"A142_0","argument":"この試合を見逃したことは、次の完全試合が達成されるまで晴らせない。","comment_id":"142","x":6.469734,"y":9.323109,"p":0.972097149625848},{"arg_id":"A142_1","argument":"前回の槇原氏の時と同じ6-0だった。","comment_id":"142","x":8.13368,"y":8.588527,"p":1},{"arg_id":"A146_0","argument":"1人のランナーも出さない完全試合は、平成6年に巨人の槙原寛己投手が達成して以来、28年ぶり16人目である。","comment_id":"146","x":8.133938,"y":8.534659,"p":1},{"arg_id":"A155_1","argument":"後半は守っている野手陣もさぞ緊張しただろう。","comment_id":"155","x":5.9844174,"y":9.432233,"p":1},{"arg_id":"A156_1","argument":"記録の凄さを理解した。","comment_id":"156","x":5.41986,"y":7.2973237,"p":1},{"arg_id":"A158_0","argument":"投手としては大谷以上かもしれない。怪物の大谷を上回る素材が出てくるとは思わなかった。","comment_id":"158","x":6.7233233,"y":7.0118065,"p":0.8325238618380972},{"arg_id":"A159_0","argument":"プロ野球史上最高のピッチングで、これ以上の投球内容は50年や100年では出てこないかもしれない。凄すぎる。","comment_id":"159","x":5.751168,"y":8.954117,"p":1},{"arg_id":"A160_0","argument":"とても素晴らしい。相手チームのファンでも見に行ってよかったと思えるレベル。","comment_id":"160","x":5.7578588,"y":8.03055,"p":1},{"arg_id":"A162_0","argument":"野手はとても暇だっただろうな。","comment_id":"162","x":5.6964746,"y":9.367948,"p":0.726898745385414},{"arg_id":"A163_0","argument":"AIの説明が難しいので、ガンダムに例えてほしい。","comment_id":"163","x":5.074451,"y":7.0873117,"p":0.26912043645279},{"arg_id":"A165_0","argument":"故障せずにプロでピークを迎えられて良かったですね。","comment_id":"165","x":6.867843,"y":7.7962904,"p":1},{"arg_id":"A168_0","argument":"ハイライト（パ・リーグTV公式）: https://www.youtube.com/watch?v=EMaowebuyLM","comment_id":"168","x":5.4431844,"y":8.028191,"p":0},{"arg_id":"A171_0","argument":"味方が強すぎて自分がやることがない、という状況がリアルスポーツでも起こるんだ。","comment_id":"171","x":5.492008,"y":9.358209,"p":0},{"arg_id":"A173_0","argument":"ロッテの佐々木朗希投手が10日、千葉市で行われたオリックス戦で28年ぶり16人目となる完全試合を達成した。","comment_id":"173","x":8.077317,"y":8.183914,"p":1},{"arg_id":"A179_0","argument":"おめでとう。素晴らしい記録。","comment_id":"179","x":5.289933,"y":6.872733,"p":0.3311732710407699},{"arg_id":"A182_0","argument":"一プロ野球ファンとして本当に嬉しいしおめでたい。","comment_id":"182","x":5.51661,"y":8.2905655,"p":0.5656750830565991},{"arg_id":"A182_1","argument":"最高のピッチングだった！","comment_id":"182","x":6.8951306,"y":7.9006042,"p":1},{"arg_id":"A186_0","argument":"大谷翔平みたいになるかな。","comment_id":"186","x":6.3536286,"y":6.879289,"p":0},{"arg_id":"A187_0","argument":"槇原以降出ていなかったんだなぁ。","comment_id":"187","x":6.842612,"y":6.697458,"p":0.5145705597405579},{"arg_id":"A189_1","argument":"オープン戦ではゾーンに嫌われたが、制球を上げるよう修正したのが素晴らしい。","comment_id":"189","x":5.918229,"y":8.71756,"p":0},{"arg_id":"A194_0","argument":"2回分はピッチャーとキャッチャーの2人だけでやってもよかったということ？！","comment_id":"194","x":6.9076457,"y":7.7215986,"p":1},{"arg_id":"A196_1","argument":"20歳にして平成から令和にかけての最高のピッチングだ。","comment_id":"196","x":7.7794065,"y":8.267241,"p":0.9770635750253256},{"arg_id":"A198_0","argument":"槙原以来28年ぶり、キャッチャーの松川選手が高卒ルーキー出場7試合目で大記録を達成したのはすごい。","comment_id":"198","x":8.216349,"y":8.051867,"p":1},{"arg_id":"A200_1","argument":"オープン戦のときからすごいことになりそうとワクワクしてたけど、ここまでとは。","comment_id":"200","x":5.747217,"y":8.58599,"p":0},{"arg_id":"A204_0","argument":"物凄いポテンシャルはあったが、こんなに早く、こんなに素晴らしい記録がついてくるとは思っていなかった。おめでとう🎉","comment_id":"204","x":5.3264403,"y":6.9197335,"p":0.4361136334911791},{"arg_id":"A205_0","argument":"今どきの野球では信じられない結果。すごい。","comment_id":"205","x":5.5158806,"y":8.832289,"p":1},{"arg_id":"A208_1","argument":"今夜のプロ野球ニュースは録画しておくべきだ。","comment_id":"208","x":5.277038,"y":8.293558,"p":0.7271303835145787},{"arg_id":"A210_1","argument":"平成6年に巨人の槙原寛己投手が達成して以来、28年ぶり16人目","comment_id":"210","x":8.231907,"y":8.714698,"p":0.5173975130559711}]},{"cluster":"奪三振記録","cluster_id":"7","takeaways":"佐々木投手は、13者連続奪三振という64年ぶりのプロ野球記録を更新し、1試合19奪三振で27年ぶりの記録に並ぶ完全試合を達成しました。この驚異的なパフォーマンスは、昨年の首位打者である吉田正尚選手からも3三振を奪うなど、圧倒的な投球内容でした。9回105球での完全試合は、奪三振数と効率の両面で歴史的な偉業といえます。","arguments":[{"arg_id":"A4_0","argument":"13連続奪三振は、4イニング連続で野手の仕事が一切ないということだからな。この暑い中、立ちっぱなしでご苦労さまですｗ","comment_id":"4","x":8.080164,"y":9.714396,"p":1},{"arg_id":"A9_0","argument":"13者連続の奪三振で64年ぶりにプロ野球記録を更新し、1試合19個の奪三振で27年ぶりにプロ野球記録に並んだ完全試合となりました。","comment_id":"9","x":8.157483,"y":9.820228,"p":0},{"arg_id":"A11_0","argument":"吉田正尚が3三振したのは2018年5月6日以来で、相手投手は中田賢一だった。","comment_id":"11","x":7.7284436,"y":9.181443,"p":1},{"arg_id":"A13_0","argument":"吉田が3三振するような投手に対して、何かができるチームなんてない。すごすぎた。","comment_id":"13","x":7.3611155,"y":9.359695,"p":0.8050055258453367},{"arg_id":"A23_1","argument":"13者連続奪三振（64年ぶり更新）。","comment_id":"23","x":8.440455,"y":9.966402,"p":0.5923533164829462},{"arg_id":"A23_2","argument":"19奪三振（27年ぶり）。","comment_id":"23","x":8.644774,"y":9.940129,"p":1},{"arg_id":"A28_0","argument":"9回投げて105球は少ない。ファールや遊び玉が24球。","comment_id":"28","x":7.3676286,"y":10.507948,"p":0.7391521417410191},{"arg_id":"A33_0","argument":"次は一試合27奪三振を目指せ！","comment_id":"33","x":8.6009865,"y":9.983252,"p":1},{"arg_id":"A52_0","argument":"19奪三振ということは野手に飛んだのは8つ。","comment_id":"52","x":7.5508595,"y":10.114023,"p":0.5854341020302166},{"arg_id":"A58_0","argument":"完全試合より連続13奪三振の方が難しい。しかも完全試合で奪三振記録タイ。パリーグTVがウキウキで動画を上げていた。https://www.youtube.com/watch?v=noD-qtreYXY","comment_id":"58","x":8.33702,"y":10.26733,"p":1},{"arg_id":"A67_0","argument":"令和の怪物。神。13連続奪三振、19奪三振、9回105球、吉田正尚から3三振、完全試合達成など、全てが凄まじい。","comment_id":"67","x":7.8137126,"y":9.900295,"p":0},{"arg_id":"A71_0","argument":"佐々木投手は13者連続奪三振で64年ぶりにプロ野球記録を更新し、1試合19個の奪三振で27年ぶりにプロ野球記録に並びました。記録ずくめの完全試合となりました。","comment_id":"71","x":8.117479,"y":9.452197,"p":0.8820187838561252},{"arg_id":"A86_0","argument":"やきう漫画で9回19奪三振105球完全試合とかネーム描いたら、編集に張り倒されそう。","comment_id":"86","x":7.6660113,"y":10.334508,"p":1},{"arg_id":"A87_1","argument":"あの三振で勝負が決まった感じがする。","comment_id":"87","x":8.493145,"y":9.541809,"p":0},{"arg_id":"A96_1","argument":"連続奪三振は50年代以来で、他はともかく連続奪三振に追いつける人は当分出なさそう。","comment_id":"96","x":8.5456915,"y":10.041042,"p":0.741082819935592},{"arg_id":"A100_1","argument":"19三振には最低でも57球必要なのに、105球で終わらせた。","comment_id":"100","x":7.5087185,"y":10.645454,"p":0.9936480743409009},{"arg_id":"A115_0","argument":"9回19奪三振105球が何よりもすごい。","comment_id":"115","x":7.5416255,"y":10.502643,"p":0.9936480743409009},{"arg_id":"A129_1","argument":"27年ぶりの奪三振タイ記録ってあって、おじさん呆然としたわ。","comment_id":"129","x":8.738362,"y":9.693511,"p":0},{"arg_id":"A130_0","argument":"去年首位打者の吉田は今日は3打数3三振だが、今季ここまで58打席で1三振。","comment_id":"130","x":7.7959666,"y":9.364553,"p":1},{"arg_id":"A130_1","argument":"去年は455打席で26三振。4試合に1度しか三振しないバッターに3三振させるバッテリー。","comment_id":"130","x":8.570166,"y":9.362849,"p":0},{"arg_id":"A138_0","argument":"5回まで13者連続、計19の奪三振、記録ずくめの完全試合。","comment_id":"138","x":8.187055,"y":10.081661,"p":0},{"arg_id":"A143_0","argument":"完全試合も凄いけど、13者連続奪三振もとんでもない記録だと思う。","comment_id":"143","x":8.395468,"y":10.303384,"p":1},{"arg_id":"A143_1","argument":"NPBの80年の歴史で過去最高記録が「9」だったのに一気に4つも更新した。","comment_id":"143","x":8.177012,"y":9.474819,"p":1},{"arg_id":"A145_0","argument":"メジャー記録と比較しても、13連続、計19の奪三振は異次元の所業である。","comment_id":"145","x":8.096979,"y":10.1894,"p":1},{"arg_id":"A152_0","argument":"27奪三振完全試合への夢が膨らむ。","comment_id":"152","x":8.633946,"y":9.845131,"p":0.6733397265194556},{"arg_id":"A173_1","argument":"佐々木投手は13者連続で三振を奪い、プロ野球記録を64年ぶりに更新した。","comment_id":"173","x":7.997519,"y":9.252175,"p":0.8914668000228128},{"arg_id":"A174_0","argument":"クレバーがセンターフライで連続三振を止めた時、オリファンは「実質勝ち」と言っていた。","comment_id":"174","x":8.339321,"y":9.75307,"p":0},{"arg_id":"A178_0","argument":"はてブのタイトルが古いけど、13連続奪三振を経て完全試合達成しました。すごすぎ。","comment_id":"178","x":8.379385,"y":10.160426,"p":1},{"arg_id":"A183_1","argument":"S-PARKで全アウトを見たが、えげつないピッチングだった。2年連続首位打者の吉田も含め、みんなが三振していた。","comment_id":"183","x":7.304647,"y":9.13537,"p":0},{"arg_id":"A184_0","argument":"高卒ドライチ3年目と1年目のバッテリーで13連続奪三振＆19奪三振しての完全試合とか、贔屓にいたら興奮しすぎて夜しか眠れなくなる。","comment_id":"184","x":8.933043,"y":9.439148,"p":0},{"arg_id":"A185_0","argument":"昭和32年7月に阪急の梶本隆夫投手、昭和33年5月に東映の土橋正幸投手が9連続奪三振のプロ野球記録をマークしました。","comment_id":"185","x":7.9349413,"y":9.205586,"p":0.9894881355279836},{"arg_id":"A185_1","argument":"佐々木投手はこの記録を64年ぶりに更新しました。","comment_id":"185","x":8.223776,"y":9.128765,"p":0},{"arg_id":"A187_1","argument":"奪三振19取っているのに、9回投げて105球というのも凄い。","comment_id":"187","x":7.520531,"y":10.340959,"p":0.8930958371071436},{"arg_id":"A196_0","argument":"昨年の首位チームに対して19奪三振で完全試合を達成した。","comment_id":"196","x":7.9710445,"y":10.007153,"p":0.5867172583422106},{"arg_id":"A197_1","argument":"奪三振は記録タイの19、連続奪三振は9→13に更新、さらに完全試合。","comment_id":"197","x":7.9881763,"y":10.214171,"p":1},{"arg_id":"A199_0","argument":"去年の首位打者、吉田正尚から3打席連続三振はすごい。彼は2年続けてシーズンで30三振以下のバッターだから。","comment_id":"199","x":7.616604,"y":9.354105,"p":1},{"arg_id":"A202_1","argument":"投球数も105球と、交代の目安とされる100球前後。","comment_id":"202","x":7.4971104,"y":10.67308,"p":0.8266751145681502},{"arg_id":"A207_0","argument":"19奪三振の日本タイ記録と13連続奪三振の日本新記録も達成した完全試合は、他の記録が霞むほどすごい。","comment_id":"207","x":7.974825,"y":10.173669,"p":0.9060119122867654},{"arg_id":"A210_0","argument":"13連続三振、トータル19三振。164km/h","comment_id":"210","x":8.120881,"y":10.28619,"p":0.7390486585942557},{"arg_id":"A211_0","argument":"更新のしかたが急激すぎる。バージョン9から一気に13になるなんて。","comment_id":"211","x":7.6632314,"y":10.463726,"p":1}]},{"cluster":"オリックス打線の状態","cluster_id":"3","takeaways":"参加者は、オリックス打線の不調とコロナ禍による主力選手の欠場が重なり、ロッテの佐々木朗希投手の圧倒的なパフォーマンスに対してオリックスが不利な状況にあったと指摘しています。また、横浜の試合がコロナ感染者の影響で中止になったのに対し、オリックスの試合が中止にならなかったことに疑問を呈しています。さらに、オリックスの打線が基本的に貧打であるが、吉田正尚選手だけは例外であること、そして昨年の優勝チームであるオリックスがこのような状況に置かれていることに対する同情も表明されています。最後に、この試合が地上波やBS/CSで中継されなかったことを惜しむ声もあります。","arguments":[{"arg_id":"A5_0","argument":"オリックス打線の状態はかなり悪いが、本来の状態でも結果は変わらなかったかもしれない。","comment_id":"5","x":5.114795,"y":10.0554085,"p":1},{"arg_id":"A51_0","argument":"オリックス打線が悪いのかと思ってリプレイを見たが、あれは誰も打てない。すごすぎる。","comment_id":"51","x":5.0918016,"y":10.0535965,"p":1},{"arg_id":"A107_0","argument":"ロッテ入る前からの朗希ファンだけど、オリックスは本当に気の毒だと思う。数日前にコロナで一軍の主力が欠けている状態で朗希に当たった。","comment_id":"107","x":5.343814,"y":9.950601,"p":1},{"arg_id":"A107_1","argument":"なぜ横浜はコロナ感染者が出て試合が中止になったのに、オリックスは中止にならなかったのか。","comment_id":"107","x":5.283503,"y":9.842204,"p":0},{"arg_id":"A119_0","argument":"昨日好調だった佐野を含めて8人がコロナで出場できなかった。","comment_id":"119","x":5.523897,"y":9.771607,"p":0},{"arg_id":"A132_0","argument":"オリックスのピッチャー山本なら、試合が30分くらいで終わりそう。","comment_id":"132","x":5.2298684,"y":9.976695,"p":0.4409083034280959},{"arg_id":"A175_0","argument":"オリックスは基本的に貧打だが、吉田正尚だけは例外である。","comment_id":"175","x":5.1116867,"y":10.081766,"p":1},{"arg_id":"A191_1","argument":"相手のオリックスは昨年の優勝チームだぜ。","comment_id":"191","x":5.2756996,"y":10.02577,"p":0.3399167803330773},{"arg_id":"A207_1","argument":"このようなチート級のパフォーマンスは、オリックスが気の毒に思えるほどだ。","comment_id":"207","x":5.157164,"y":10.005506,"p":0.4409083034280959},{"arg_id":"A208_0","argument":"ロッテ×オリックスの試合が地上波やBS/CSで中継されていないのはもったいない。","comment_id":"208","x":5.296241,"y":9.856421,"p":1}]},{"cluster":"称賛と驚嘆","cluster_id":"2","takeaways":"参加者は、ある選手の卓越した才能とパフォーマンスに対する驚きと称賛を表明しています。彼のメジャーリーグへの移籍を強く推奨し、その成長と成功を高く評価しています。また、彼の能力が「令和の怪物」と称されるほどであり、今後のさらなる活躍に期待を寄せています。","arguments":[{"arg_id":"A6_0","argument":"凄い。江川並みのインパクトではないか。","comment_id":"6","x":4.8586745,"y":5.431864,"p":1},{"arg_id":"A12_0","argument":"すごい。早くメジャーに行ってほしい。","comment_id":"12","x":5.473296,"y":5.587391,"p":0.2062352825849336},{"arg_id":"A14_0","argument":"いや、もう、めちゃくちゃすごい。","comment_id":"14","x":4.606,"y":5.2455497,"p":0.9088450571283744},{"arg_id":"A23_3","argument":"早くメジャーに行け。","comment_id":"23","x":5.723321,"y":5.778049,"p":0.505588760395133},{"arg_id":"A29_0","argument":"すごい","comment_id":"29","x":4.8350697,"y":5.1451836,"p":0.4355839978609732},{"arg_id":"A36_1","argument":"じっくり育てたのが本当に素晴らしい。","comment_id":"36","x":4.96838,"y":5.794526,"p":1},{"arg_id":"A40_0","argument":"かつて横浜には大魔神が現れたが、今度の佐々木さんは令和の怪物からさらに通り名が変わるほどの大活躍となるのか。","comment_id":"40","x":4.3755045,"y":6.6479726,"p":0.4010154029488114},{"arg_id":"A43_0","argument":"今すぐにでもメジャーに行った方がいいのではないか。","comment_id":"43","x":5.8242373,"y":5.857321,"p":1},{"arg_id":"A44_0","argument":"すごい","comment_id":"44","x":4.7776275,"y":5.2295375,"p":0.2602372757028132},{"arg_id":"A48_0","argument":"メジャーリーグに行くのですか？","comment_id":"48","x":5.875951,"y":5.832226,"p":1},{"arg_id":"A54_1","argument":"そこから誰も達成していなかったのはすごい。","comment_id":"54","x":4.3900166,"y":5.337541,"p":1},{"arg_id":"A61_1","argument":"凄いことをやってくれた！","comment_id":"61","x":4.9360523,"y":5.6442385,"p":1},{"arg_id":"A69_0","argument":"つよすぎ","comment_id":"69","x":5.136607,"y":4.922914,"p":0},{"arg_id":"A74_0","argument":"素晴らしい。","comment_id":"74","x":4.46251,"y":5.5386467,"p":0.9171662241404188},{"arg_id":"A78_0","argument":"狼鬼は今年、食玩が発売予定。","comment_id":"78","x":4.22878,"y":6.5615616,"p":1},{"arg_id":"A84_0","argument":"これはすごい。","comment_id":"84","x":4.5157623,"y":5.430978,"p":1},{"arg_id":"A88_0","argument":"もう日本ですることがないのではないか。","comment_id":"88","x":5.756402,"y":5.8964343,"p":0.7936668199856329},{"arg_id":"A95_0","argument":"これはまだ伝説の始まりにすぎない、と思わせる凄みがある。","comment_id":"95","x":4.651914,"y":6.147465,"p":0.1637515760385395},{"arg_id":"A103_0","argument":"本物じゃねえか！","comment_id":"103","x":5.1788445,"y":5.651459,"p":0},{"arg_id":"A124_0","argument":"めでた","comment_id":"124","x":4.957405,"y":5.0839887,"p":1},{"arg_id":"A127_0","argument":"素晴らしい。","comment_id":"127","x":4.6332464,"y":5.5336657,"p":0.9171662241404188},{"arg_id":"A137_0","argument":"やはり怪物だった。","comment_id":"137","x":4.2864203,"y":6.448257,"p":1},{"arg_id":"A138_1","argument":"“令和の怪物”がじっくり育成され、初の開幕ローテーション入り。","comment_id":"138","x":4.2137938,"y":6.552288,"p":1},{"arg_id":"A144_0","argument":"まさに令和の怪物だ。","comment_id":"144","x":4.290084,"y":6.431748,"p":1},{"arg_id":"A147_0","argument":"これはマイライフスレッドの話題ですか？","comment_id":"147","x":5.9719424,"y":5.986658,"p":0.3165468157177784},{"arg_id":"A149_0","argument":"すごい。","comment_id":"149","x":4.976812,"y":5.3983207,"p":0.9298428839543575},{"arg_id":"A157_0","argument":"まさに令和の怪物だ。","comment_id":"157","x":4.25682,"y":6.458453,"p":1},{"arg_id":"A158_2","argument":"早めに高く売れないかな。","comment_id":"158","x":5.8156486,"y":5.847256,"p":1},{"arg_id":"A161_0","argument":"すごい！","comment_id":"161","x":4.9454126,"y":5.5844526,"p":1},{"arg_id":"A164_0","argument":"すごい","comment_id":"164","x":4.91354,"y":5.0911965,"p":1},{"arg_id":"A176_0","argument":"よし！メジャーいこう！","comment_id":"176","x":5.508492,"y":5.683983,"p":0.2649967406859612},{"arg_id":"A180_0","argument":"これが令和版の怪物か…エグいわ。","comment_id":"180","x":4.20311,"y":6.511301,"p":1},{"arg_id":"A188_0","argument":"これはすごい。","comment_id":"188","x":4.4717026,"y":5.271255,"p":1},{"arg_id":"A195_0","argument":"すごい","comment_id":"195","x":4.937362,"y":5.075707,"p":1},{"arg_id":"A200_0","argument":"宇宙の法則が乱れる！","comment_id":"200","x":5.052187,"y":5.8545504,"p":0},{"arg_id":"A201_2","argument":"全てがすごい。","comment_id":"201","x":4.694624,"y":5.0802407,"p":0.2602372757028132},{"arg_id":"A202_0","argument":"凄い！デグロムが日本に来たらこんな感じなのかな。","comment_id":"202","x":4.7449093,"y":5.808731,"p":0},{"arg_id":"A206_0","argument":"完全なるんほー","comment_id":"206","x":5.1199656,"y":5.165187,"p":0}]},{"cluster":"過去の完全試合との比較","cluster_id":"0","takeaways":"28年ぶりの完全試合達成に対する驚きと称賛が多く寄せられています。平成6年に槙原寛己投手が達成して以来の記録であり、若いバッテリー（20歳と18歳）が成し遂げたことに特に注目が集まっています。彼らの今後の成長と故障のない活躍を期待する声が多く、特に160kmを超える速球やフォークの動きに感嘆の声が上がっています。また、吉井コーチの指導力にも感謝の意が示されています。","arguments":[{"arg_id":"A17_0","argument":"28年前は槇原だったのか。","comment_id":"17","x":8.646628,"y":8.309794,"p":0.635476796562747},{"arg_id":"A23_0","argument":"前人未到の大記録。完全試合（28年ぶり）。","comment_id":"23","x":8.323424,"y":8.528479,"p":0.4363752962518345},{"arg_id":"A25_0","argument":"28年ぶり？槇原が前に達成してなかったっけ？と思ったら、それが28年前なのね…年取ったわ。","comment_id":"25","x":8.69604,"y":8.3390045,"p":1},{"arg_id":"A26_0","argument":"高卒で身長160cmを超えるピッチャーが奪三振記録を達成したことで、ストッパー毒島を思い出した。","comment_id":"26","x":8.448321,"y":8.007802,"p":0},{"arg_id":"A28_2","argument":"今後も怪我少なく活躍してほしい。","comment_id":"28","x":9.359251,"y":7.1449695,"p":0.7561846347844111},{"arg_id":"A50_0","argument":"334か月ぶりなのが面白い。","comment_id":"50","x":8.814604,"y":8.3089905,"p":0.3947203769755814},{"arg_id":"A56_0","argument":"槇原の『完全視界』からもう28年も経ったのか。","comment_id":"56","x":8.6790495,"y":8.3841915,"p":1},{"arg_id":"A57_0","argument":"本人のコメントが良い。腐らずに頑張ってきたんだな。","comment_id":"57","x":9.527422,"y":6.989421,"p":1},{"arg_id":"A76_0","argument":"まだ身体の線もプロとしては華奢な印象なのに、よくぞここまでやり切れるものだ。","comment_id":"76","x":9.654519,"y":7.3668303,"p":0.5941474792771053},{"arg_id":"A76_1","argument":"この大記録が今後に悪い影響を及ぼさないことを祈る。質の悪い故障をせずに、自然体で伸びて行って欲しい。","comment_id":"76","x":9.490415,"y":7.2144876,"p":0.8962053724129072},{"arg_id":"A77_0","argument":"28年ぶりということは、山井と岩瀬の件は計算に入らないのか。当時は合理的判断だと思っていたが、今は代えなければ良かったと思う。","comment_id":"77","x":8.7072315,"y":8.355602,"p":1},{"arg_id":"A79_0","argument":"捕手と合わせて38歳では、今後の更新がほぼ不可能ではないか。","comment_id":"79","x":9.130829,"y":8.493858,"p":1},{"arg_id":"A92_2","argument":"無論、バッテリーでこれからも実績を積み重ねてほしい。","comment_id":"92","x":9.20226,"y":7.9974008,"p":1},{"arg_id":"A94_0","argument":"フォークが150kmくらいで動くのは驚きだ。","comment_id":"94","x":9.694872,"y":8.674471,"p":0.5270096432163267},{"arg_id":"A97_2","argument":"西純も焦らずに頑張ってほしい。","comment_id":"97","x":9.443327,"y":6.98196,"p":0.7969210046217681},{"arg_id":"A100_0","argument":"心拍数が上がった様子もなく、涼しい顔で160kmを投げていた。","comment_id":"100","x":9.598023,"y":8.703358,"p":1},{"arg_id":"A101_1","argument":"あとは体作りと耐久力が必要だ。","comment_id":"101","x":9.691931,"y":7.2957983,"p":0.6122326276234129},{"arg_id":"A106_0","argument":"20歳で160km代を普通に投げるなんてすごい。まだまだこれから仕上がるのに。","comment_id":"106","x":9.581028,"y":8.647438,"p":1},{"arg_id":"A106_1","argument":"25歳で160後半から170kmに達しそう。","comment_id":"106","x":9.542235,"y":8.695373,"p":1},{"arg_id":"A108_0","argument":"今シーズン中にあと何回できるか予想する次元。","comment_id":"108","x":9.126605,"y":8.778823,"p":1},{"arg_id":"A114_0","argument":"バッテリー2人の年齢を足しても38歳。いやあ凄い。","comment_id":"114","x":9.352793,"y":8.2176285,"p":0.5773106897047815},{"arg_id":"A123_0","argument":"年齢とキャリアからして、あと3回くらい完全試合を達成するポテンシャルがある。","comment_id":"123","x":9.193596,"y":8.920884,"p":1},{"arg_id":"A129_2","argument":"数えてみれば四半世紀過ぎてるか......","comment_id":"129","x":9.020398,"y":8.453898,"p":1},{"arg_id":"A140_0","argument":"プロ3年目で体は細いけど、その分キレがあって素晴らしい。","comment_id":"140","x":9.712897,"y":7.6834993,"p":0.4131594221908991},{"arg_id":"A148_0","argument":"160キロが当たり前の時代が来るのかな…来年あたり167キロとか投げていそう。","comment_id":"148","x":9.265857,"y":8.495918,"p":1},{"arg_id":"A153_1","argument":"20歳と18歳のバッテリーが成し遂げたのは驚きだ。","comment_id":"153","x":9.305056,"y":8.112074,"p":1},{"arg_id":"A156_0","argument":"平成6年に巨人の槙原寛己投手が達成して以来の記録だと知り、昔見たことを思い出した。","comment_id":"156","x":8.204011,"y":8.578639,"p":1},{"arg_id":"A165_1","argument":"これからも故障に気をつけて頑張ってください。","comment_id":"165","x":9.533721,"y":7.122311,"p":1},{"arg_id":"A167_0","argument":"20歳と18歳のバッテリー！若い人の活躍はうれしいね。","comment_id":"167","x":9.337472,"y":7.937014,"p":0.8650102547348675},{"arg_id":"A191_0","argument":"本人の努力もありつつ、吉井コーチのお手柄だと思う。","comment_id":"191","x":9.2706995,"y":6.842367,"p":0.4496751584764317},{"arg_id":"A197_2","argument":"3年目についに完成した感がある。","comment_id":"197","x":9.25201,"y":8.856394,"p":1},{"arg_id":"A209_0","argument":"\"去年より体重が5キロ増えた\"を\"筋骨が5キロ増えた\"にしよう(´･_･`)","comment_id":"209","x":9.659731,"y":7.8024287,"p":0.3809468977377235}]},{"cluster":"投球内容と技術分析","cluster_id":"4","takeaways":"この議論では、あるピッチャーの驚異的なパフォーマンスについて話し合われています。彼は主にフォークボールと剛速球のストレートを駆使し、三振を多く奪いながらも球数が少ないという異例の投球を見せました。特に、完全試合を達成する中で、野手たちがほとんど守備機会を得られなかったことや、ストレートとフォークの威力がメジャーリーグでも通用するレベルであることが強調されています。参加者は、このピッチャーの将来性と、彼の投球がいかに特異であるかを称賛しています。","arguments":[{"arg_id":"A18_0","argument":"最終打者も三振なのか、すごい。","comment_id":"18","x":7.38696,"y":9.7381315,"p":0.5942300000370822},{"arg_id":"A21_0","argument":"フォークと剛速球のストレートが中心のピッチャーは腕への負担が大きく、若いうちに怪我することが多いので心配である。","comment_id":"21","x":6.434517,"y":10.40674,"p":1},{"arg_id":"A22_0","argument":"三振が多すぎて、球が飛んできたときに野手が混乱していた。凄かった。","comment_id":"22","x":6.9653907,"y":9.844809,"p":0.7774349580097629},{"arg_id":"A38_1","argument":"ストレートはほとんど打者が打ち返していた。","comment_id":"38","x":6.3504314,"y":10.279125,"p":0.531242732550858},{"arg_id":"A46_0","argument":"ダイジェストを見た感じ、あと9イニングやっても一人もランナーを出さなさそうな余裕っぷりだった。末恐ろしい。","comment_id":"46","x":6.877901,"y":10.4603405,"p":0},{"arg_id":"A52_1","argument":"サードとショートは9回に初めてゴロが飛んできたので、すごい緊張しそう。","comment_id":"52","x":7.105507,"y":9.650118,"p":0.6731245659126712},{"arg_id":"A52_2","argument":"ちなみにレフトは守備機会なしだった。","comment_id":"52","x":6.263752,"y":9.7230835,"p":0},{"arg_id":"A63_0","argument":"ダイジェストを見たけど、落ちるわけないくらい速いフォークと速すぎて手が出せないストレートの2種類でやっているの？","comment_id":"63","x":6.5427485,"y":10.549396,"p":0.4406401564482102},{"arg_id":"A82_2","argument":"今日もショートの最後がやばかった。","comment_id":"82","x":6.9833326,"y":9.347836,"p":0},{"arg_id":"A100_2","argument":"ほぼストライクしか投げていない。","comment_id":"100","x":6.6309547,"y":10.091572,"p":0},{"arg_id":"A101_0","argument":"このまますぐにメジャーに行っても通用するストレートとフォークだな、すごい。","comment_id":"101","x":6.5219283,"y":10.537936,"p":0.4882476164525268},{"arg_id":"A112_0","argument":"三振数に対して球数がおかしい。遊び球という概念がないのか。","comment_id":"112","x":7.0553927,"y":9.89933,"p":1},{"arg_id":"A112_1","argument":"他にも色々おかしいが、球数が一番おかしいと思う。","comment_id":"112","x":6.7075915,"y":9.496018,"p":0},{"arg_id":"A150_0","argument":"漫画なら没になる投球内容。","comment_id":"150","x":6.5188227,"y":9.5463295,"p":1},{"arg_id":"A153_0","argument":"これだけ三振を取りながら球数が少ないのは素晴らしい。","comment_id":"153","x":7.166442,"y":9.89688,"p":1},{"arg_id":"A155_0","argument":"完全試合達成にはエラーによる出塁も許されない。","comment_id":"155","x":6.27321,"y":9.603687,"p":1},{"arg_id":"A169_0","argument":"9回、ショートゴロで藤岡が下がって捕球し、かなり緊張しているように見えた。","comment_id":"169","x":7.023641,"y":9.466439,"p":0.6731245659126712},{"arg_id":"A172_0","argument":"ストレートが10km/h速い大魔神が9イニング続けて登板するようなものだ。","comment_id":"172","x":6.7168264,"y":10.563903,"p":0.4019520123339892},{"arg_id":"A189_0","argument":"彼の凄さは、これだけの三振を奪いながら球数が少ないことだ。","comment_id":"189","x":7.2981877,"y":9.803537,"p":1},{"arg_id":"A189_2","argument":"投げるたびに良くなっている。","comment_id":"189","x":6.801305,"y":9.997536,"p":0.7202814011507505},{"arg_id":"A190_0","argument":"ほとんどストレートとフォークという、クローザーのような投球を9イニング続けながらの完全試合。これでもまだ素材の段階だと思う。","comment_id":"190","x":6.426647,"y":10.402349,"p":1},{"arg_id":"A197_0","argument":"パ・リーグTVで投球を見たが、ストレートは160kmオーバー、フォークは140kmオーバーで鋭く落ちる。","comment_id":"197","x":6.3673296,"y":10.369184,"p":1}]}],"comments":{"1":{"comment":"\"彼って高校時代に監督が投げさせないで甲子園いけなかった人だよね。それが良かったのかな。めちゃめちゃ連投させて問題になった済美高校の安楽ってその後どうなったんだろ？\""},"2":{"comment":"\"また岩手出身のすごい野球選手があらわれた。\""},"3":{"comment":"\"個人的には野田の名が残った事を含めて完全な試合。投手としてのピークをどこに置くかについては様々あるだろうが、少なくとも中学生に強いるのは虐待にほかならないだろう。\""},"4":{"comment":"\"13連続奪三振ってまるまる4イニング野手の仕事が一切ないってことだからな この暑いなかボッ立ちご苦労さまですｗ\""},"5":{"comment":"\"オリックス打線の状態はかなりよろしくないけど、本来であってもこの内容なら関係なかったのかなあ\""},"6":{"comment":"\"凄い。江川並みのインパクトではないか。\""},"7":{"comment":"\"野球全然わからないけど、この閉塞感の中に希望というか明るいニュースは嬉しいなぁ。\""},"8":{"comment":"\"なお千葉テレビは痛恨の放送なし\""},"9":{"comment":"\"“13者連続の奪三振で64年ぶりにプロ野球記録を更新したほか、1試合19個の奪三振では27年ぶりにプロ野球記録に並び、記録ずくめの完全試合となりました。” またフィクションが敗北してしまったか。\""},"10":{"comment":"\"中日ファンだったので近藤のことを思い出しちゃった。完全試合のことは一旦リセットして忘れて、好きなように投げてほしいなー。\""},"11":{"comment":"\"吉田正尚が3三振するのは2018/5/6振りで相手投手は中田賢一、こっちは阪神関係あった。三重殺と完全試合の記録もあるのは驚き\""},"12":{"comment":"\"すごすぎ。早くメジャー行ってくれ\""},"13":{"comment":"\"吉田が3三振するような投手に何かができるチームなんてない。すごすぎた。\""},"14":{"comment":"\"いや、もう、めちゃくちゃすごい。\""},"15":{"comment":"\"甲子園の予選の決勝で無理にでも投げさせてたら今の活躍はなかったかもしれないと思うと大船渡高校の監督は英断だったな。\""},"16":{"comment":"\"全部読んでたっら元は震災でひどく傷つけられた少年だった。いろんな人が支えたはずだが、こんなに立派になるとは。涙がちょちょぎれた。\""},"17":{"comment":"\"28年前は槇原なのか。\""},"18":{"comment":"\"最終打者も三振なのかすげえ\""},"19":{"comment":"\"夏の県決勝で投げさせなかった監督が偉い。見事に結果が出てもう悪く言われることはないんじゃないかな。\""},"20":{"comment":"\"初完投初完封で完全試合ってなによ\""},"21":{"comment":"\"あまりに凄すぎる。しかしフォークと剛速球のストレートが中心のピッチャーは腕への負担が大きくて、皆若いうちに怪我してるので心配でもある。願わくばこの輝きを長く見たい。\""},"22":{"comment":"\"三振取りすぎて球飛んできた時野手がわちゃわちゃしてた。凄かったわ\""},"23":{"comment":"\"前人未到の大記録。完全試合（28年ぶり）。13者連続奪三振（64年ぶり更新）。19奪三振（27年ぶり）。早くメジャーに行け\""},"24":{"comment":"\"ま、生きてるうちにもう一回観られて良かったよ。槙原も成仏できるし何よりだw\""},"25":{"comment":"\"28年ぶり？槇原が前に達成してなかったっけ？って思ったらそれが28年前なのね…年取ったわ\""},"26":{"comment":"\"高卒で長身の160超ピッチャーが奪三振記録って所でストッパー毒島を思い出したけど、みんな言うように漫画超えちゃってる…配信で見てたけど圧巻だった\""},"27":{"comment":"\"観たかった…。\""},"28":{"comment":"\"9回投げて105球は少ねええ。ファールや遊び玉が24球て。槙原でリアルタイム感動したおっさんだけど、若い選手が記録を作っていくのって嬉しいなあ。今後も怪我少なく活躍してほしいよ！\""},"29":{"comment":"\"すごい\""},"30":{"comment":"\"久しぶりに実家に行っていたのだが、皆でカードゲームしている最中に、急に母がスマホの通知を見て「ゲーム中に失礼、でもロウキが完全試合！」と叫んで、労基？野球？と混乱した。母って野球好きだったっけ……。\""},"31":{"comment":"\"松川がここぞでしっかり捕球したのも大きかった。まだ18歳やぞwww すばらしい＼(^o^)／おめでとうございます＼(^o^)／\""},"32":{"comment":"\"ポスティングしたらMLB各球団はいくら出すんだろうな\""},"33":{"comment":"\"次は一試合27奪三振を目指せ！\""},"34":{"comment":"\"本当にすごい投球だった\""},"35":{"comment":"\"漫画「ブ●ゴ」みたいな試合だな…。\""},"36":{"comment":"\"90年代のロッテだったら、人材不足で1年目から酷使して、今ごろ壊してたと思うので、じっくり育てたのがほんとに素晴らしい。千葉ロッテが球界の至宝を育てるとは思わなかった。\""},"37":{"comment":"\"MAJORの茂野吾郎かよみたいな感じの試合内容\""},"38":{"comment":"\"動画見たけどちょっと無茶苦茶すぎる。ストレートほとんど打者が着払いしてた\""},"39":{"comment":"\"“「正直あまり意識していなく、打たれてもいいかなと思いながらキャッチャーの松川を信じて投げた」と話しました。”良い。\""},"40":{"comment":"\"かつて横浜には大魔神が現れたが、今度の佐々木さんははたして。\"令和の怪物\"からさらに通り名が変わる(ほどの大活躍となる)のか。\""},"41":{"comment":"\"岩手県から3人目の刺客がMLBを襲う\""},"42":{"comment":"\"有藤「なぜヒーローインタビューに松川を呼ばないのか」\""},"43":{"comment":"\"今すぐにでもメジャー行った方がいいんじゃないかな。ものすごい生涯成績を残すかもしれない。\""},"44":{"comment":"\"すごい\""},"45":{"comment":"\"投球内容が優れた記録ずくめの完全試合ですごかった。\""},"46":{"comment":"\"ダイジェストを見た感じ、あと9イニングやっても一人もランナーを出さなさそうな余裕っぷりだったように見える。末恐ろしいわね。\""},"47":{"comment":"\"岩手、まじで人いないのにどうなってんだ\""},"48":{"comment":"\"メジャー行くん？\""},"49":{"comment":"\"まーくんみたいな選手2度と出ないと思ったら大谷くんが現れ、大谷くんみたいな選手2度と出ないと思ったらこれですよ\""},"50":{"comment":"\"334か月ぶりなの草\""},"51":{"comment":"\"オリックス打線があかんのか？と思ってリプレイ見たけどあんなん誰も打てんわ……すごすぎる\""},"52":{"comment":"\"19奪三振ということは野手に飛んだのは8つ。サードとショートは9回に初めてゴロが飛んできたということですごい緊張しそう…ちなみにレフトは守備機会なしだとか。\""},"53":{"comment":"\"プロ初完投初完封がこれ…。末恐ろしい。松川捕手も。\""},"54":{"comment":"\"槙原の完全試合は見てたから覚えてる。そこから誰も達成してなかったのか。すごいわ。観戦してた人は運がいい。\""},"55":{"comment":"\"岩手、化け物を量産しすぎでは？この少子化の時代にあって…\""},"56":{"comment":"\"つか槇原の完全視界からもう28年も経ってたのか。\""},"57":{"comment":"\"とにかく本人のコメントがよい、くさらずがんばってきたんだな\""},"58":{"comment":"\"完全試合より実は連続13奪三振の方が難しいっていうしかも完全試合で奪三振記録タイだしほんとやばいわパリーグTVがウキウキであげてたhttps://www.youtube.com/watch?v=noD-qtreYXY\""},"59":{"comment":"\"野球詳しくないがピッチャーが誰も塁に出さないことを「完全」試合と呼ぶのなんかモヤる。逆に聞きたいのだが野球のパーフェクトってそういうことでいいん？それはさておき佐々木選手おめでとうございます。\""},"60":{"comment":"\"また岩手。何か規格外のDNAでもあるのだろうか？\""},"61":{"comment":"\"ヒーローインタビュー、捕手の松川を褒め称えていたけど、それはそうとしてもっと自分の事も語って良いんだよーと思った。凄い事やってくれた！\""},"62":{"comment":"\"バッテリー組んだ捕手も若くて、ロッテの未来、明るいね。今日は良いニュースがあって嬉しい。\""},"63":{"comment":"\"ダイジェスト見たけど、落ちるわけないくらい速いから手が出てしまうフォークと速すぎて手が出せないストレートの2種でやってんの？素人なので今後出てくる色々な解説が楽しみ。\""},"64":{"comment":"\"若者の現実離れが凄い。／ 受けた捕手も高卒1年目というのだから凄い。\""},"65":{"comment":"\"またマンガ超えな記録が。他の試合では西武がトリプルプレイを決めたらしいし、天気が良くなると野球の質もあがるんかな。ともあれおめでとうございます。\""},"66":{"comment":"\"捕手も含めてロッテの育成がハマったなぁ、1年前より制球がめちゃくちゃ良くなった\""},"67":{"comment":"\"令和の怪物。神。13連続奪三振がヤバすぎるし19奪三振も凄いし9回105球も頭おかしくなるし吉田正尚から3三振も意味わからん。完全試合達成だけでも凄まじいのにそれ以外の記録も偉業揃いとか。\""},"68":{"comment":"\"佐々木ロウキがすごいのはすごいとして松川くんですよ...高卒1年目の捕手が開幕スタメン、しかも完全試合とか...2度と現れないレベルですごい。フレッシュバッテリー最高です👏🏻\""},"69":{"comment":"\"つよすぎ\""},"70":{"comment":"\"「佐々木郎希なんてたいしたことない。岩手県ですらここ１０年で３人いるレベルのピッチャー」というコピペ、自分が最初に考えたことにならないかなあw岩手県すごすぎ。\""},"71":{"comment":"\" \"この試合で佐々木投手は13者連続の奪三振で64年ぶりにプロ野球記録を更新したほか、1試合19個の奪三振では27年ぶりにプロ野球記録に並び、記録ずくめの完全試合となりました\"\""},"72":{"comment":"\"記録云々よりも捕手の松川も含めてマリーンズの編成、育成の集大成って感じが素晴らしい。\""},"73":{"comment":"\"岩手県民としては、あの陸前高田を襲った震災を生き延びてよくぞ…と涙が出てくる。おめでとうございます!!\""},"74":{"comment":"\"あっぱれ\""},"75":{"comment":"\"捕手の松川、高卒1年目で完全試合して、打てば走者一掃ってどうなってるんだ。\""},"76":{"comment":"\"まだ身体の線もプロとしては華奢な印象なのに、よくぞここまでやり切れるものだ。この大記録が今後に悪い影響を及ぼさないことをひたすら祈る。質の悪い故障をせずに、自然体で伸びて行って欲しい。\""},"77":{"comment":"\"28年ぶりってことは山井と岩瀬のやつは計算に入らないんだな。当時は合理的判断と思ってたけどいま初めて代えなけりゃ良かったのにと思った。\""},"78":{"comment":"\"狼鬼は今年、食玩が発売予定/完全試合達成者の3/16が佐々木姓\""},"79":{"comment":"\"捕手と合わせて38歳は今後の更新がほぼ不可能では\""},"80":{"comment":"\"ブコメ読んでるだけでもわくわくが伝わってきて楽しくて嬉しい。\""},"81":{"comment":"\"無茶苦茶だ。大谷翔平が霞んで見える。\""},"82":{"comment":"\"ソフトバンクユーザー特典で、ネット中継で最後の方生で見られた。思えばパーフェクトと言えば槙原氏のやつも見てたな。長嶋一茂がフライ取るのをビクビクしながら見てた記憶。今日もショート最後やばかったけど\""},"83":{"comment":"\"玉山鉄二も十数年ぶりに主演映画あるみたいね\""},"84":{"comment":"\"わーすごいこれはすごい\""},"85":{"comment":"\"1試合のパフォーマンスとしては日本プロ野球史上最高では？\""},"86":{"comment":"\"やきう漫画で9回19奪三振105球完全試合とかネーム描いたら編集に張り倒されそう。\""},"87":{"comment":"\"カーブを続けた吉田の打席が印象的。あの三振で勝負あった感じある。\""},"88":{"comment":"\"もう日本ですることないやん\""},"89":{"comment":"\"岩手県凄すぎ\""},"90":{"comment":"\"なんとなく佐々木希に名前が似てる人としか認識してなくてすみませんでした。おめでとうございます。\""},"91":{"comment":"\"完全試合ｗｗｗｗｗｗ素晴らしいね\""},"92":{"comment":"\"近藤真一投手も衝撃だったが彼はあの初登板以降ぱっとしなかった（それでも偉大な記録）佐々木投手が仮にこの一試合だけだったとしても伝説に残るには十分すぎる。無論バッテリーでこれからも実績を積み重ねてほしい\""},"93":{"comment":"\"大船渡の監督とロッテはもっと褒められるべき。よく佐々木朗希という逸材を潰さなかった！\""},"94":{"comment":"\"フォークが150kmくらいで草生える。\""},"95":{"comment":"\"これはまだ伝説の始まりにすぎない、と思わせる凄みがある\""},"96":{"comment":"\"完全試合が槇原以来で1試合19Kはフォークお化けの野田以来と。この辺はまだ90年代だけど連続奪三振は50年代か。他はともかく連続奪三振追いつける人は当分出なさそう\""},"97":{"comment":"\"正直、佐々木朗希がここまで理想通りにこの早さで育つとは思わんかった。というか佐々木世代の高卒ドライチ投手の順調すぎる仕上がりヤバい。西純…焦らなくていい、頑張ってくれ。\""},"98":{"comment":"\"野球のことはわからんけど、すごいんだろうなぁ！\""},"99":{"comment":"\"よく名前を見かけるけど佐々木希さんと混同する。朝倉未来選手も本名ならともかくリングネームだったら朝比奈みくるに見えて混同する。\""},"100":{"comment":"\"心拍数上がった様子もなく、涼しい顔で160km投げてた。19三振には最低でも57球必要なのに、105球で終わらせた。ほぼストライクしか投げてない。\""},"101":{"comment":"\"このまますぐにメジャーに行っても通用するストレートとフォークだな、すげえ。あとは体作りと耐久力か\""},"102":{"comment":"\"やきうクラスタではないので差し出がましいのですが、彼の肩と将来を大事にした大船渡の監督も褒めてあげてほしい。\""},"103":{"comment":"\"本物じゃねえか！\""},"104":{"comment":"\"TLに「まだ完全試合が残ってる」って文字が流れて「？？？」となった。大谷といい岩手すげーな\""},"105":{"comment":"\"先発完投するサファテという書き込みを見て、以下にやばいかがわかった。WHIP0.39とか見たことねえよ\""},"106":{"comment":"\"20歳で160km代普通に投げるなんて、まだまだ仕上がるのこれからなのにすごいなぁ…25で160後半〜170kmいきそう。\""},"107":{"comment":"\"ロッテ入る前からの朗希ファンやけどオリックスはガチで気の毒やろ、数日前コロナで一軍の主力欠いて朗希に当たった。なんで横浜はコロナ感染者出て中止になったのにオリックスは中止にならんのや。\""},"108":{"comment":"\"今シーズン中にあと何回できるか予想する次元\""},"109":{"comment":"\"凄いの一言。願わくば、彼の野球人生の久しからんことを。\""},"110":{"comment":"\"野球よく分からんが凄いらしいので記念ブクマ\""},"111":{"comment":"\"なんでや！ロッテ関係あるやろ！ / 松川捕手、2週間前まで高校生だったと思えない貫禄…\""},"112":{"comment":"\"三振数に対して球数おかしくね？遊び球という概念ないのか。他も色々おかしいのだけど球数が一番おかしいと思う\""},"113":{"comment":"\"いやもう今日のスポーツニュースはこの人一色でしょう。\""},"114":{"comment":"\"バッテリー2人の年齢を足しても38歳。いやあ凄い。\""},"115":{"comment":"\"9回19奪三振105球が何よりもやばい\""},"116":{"comment":"\"チート\""},"117":{"comment":"\"こんなの漫画でも嘘だろって言われちゃう\""},"118":{"comment":"\"佐々木はもちろんキャッチャーも高卒ルーキーの松川なのがすごいなこれ。捕手でもうスタメンで試合に出てたのか。\""},"119":{"comment":"\"言い訳させてもらうと、昨日好調だった佐野含めて8人もコロナで出られなかったのよねえ、オリックスさん。\""},"120":{"comment":"\"岩手で号外が出るレベル\""},"121":{"comment":"\"無理に甲子園を目指さずにいた監督の判断は正しかったと。\""},"122":{"comment":"\"ノーヒットノーランどころか完全試合とは。それも前年パリーグ覇者のオリックス相手にな。凄いけど、まあそれだけ。\""},"123":{"comment":"\"年齢とキャリアからしてあと3回くらい完全試合やってくれそうなポテンシャル。大谷より凄い選手は出ないと思ってたが、投手で本当にとんでもないのが出てきた。\""},"124":{"comment":"\"めでた\""},"125":{"comment":"\"すごいな。完全試合だけで充分すごいのに、プラスαの記録がてんこ盛り。\""},"126":{"comment":"\"転生したら野球選手だった！？２～大谷さんと俺がワールドシリーズで激突するまでの物語～\""},"127":{"comment":"\"素晴らしい。\""},"128":{"comment":"\"Youtubeでまとめ見たけど強烈だった。全然バットが当たらない。後半は当てて来てるけど最後のバッターでまた三振ゲット。2001年世代すげー。\""},"129":{"comment":"\"なんちゅうえげつない記録なんだ。そして27年ぶり奪三振タイ記録ってあっておじさん呆然としたわ。数えてみれば四半世紀過ぎてるか......\""},"130":{"comment":"\"去年首位打者の吉田は今日は3打数3三振だが、今季ここまで58打席で1三振。なお、去年は455打席で26三振。4試合に1度しか三振しないバッターに3三振させるバッテリー。\""},"131":{"comment":"\"ダルや大谷、そして佐々木朗希を育てたコーチとかいつメジャーから声かかってもおかしくなさそう。\""},"132":{"comment":"\"オリックスのピッチャー山本だったら、試合30分くらいで終わりそう\""},"133":{"comment":"\"歴史\""},"134":{"comment":"\"この時代にこんな大記録が出るとは\""},"135":{"comment":"\"ちょっとどうかしてる記録が生まれてしまった。いやはや。\""},"136":{"comment":"\"パTVがまとめ動画をYouTubeに上げるはずなので見なければだ。ほんとにおめでとう！ 近頃の若い子はすごいね/ THE FEATURE PLAYER来てた https://www.youtube.com/watch?v=xiunae5qVcE\""},"137":{"comment":"\"やはり怪物だった\""},"138":{"comment":"\"「5回まで13者連続 計19の奪三振 記録ずくめの完全試合　“令和の怪物” じっくり育成され 初の開幕ローテーション入り」\""},"139":{"comment":"\"昭和初の完全試合は藤本英雄(背番号17)で、平成初(かつ唯一)の完全試合は槙原寛己(背番号17)で、今回の21世紀初・令和初の完全試合は佐々木朗希(背番号17)が達成。\""},"140":{"comment":"\"凄い凄いと思ってたけど、ここまで来たら本当に素晴らしいね！プロ3年目で、未だ体も細いけど、その分キレがあって良いのかも！\""},"141":{"comment":"\"千葉マリンかなと思ったらやっぱり千葉マリンだった　ちょうど古田と俊介と星野と下柳がマリン風の話する動画を見たところだった https://youtu.be/62wGfOPeQqg?t=713 野田の19Kも千葉マリン　ランナー出さなければ盗塁もされない\""},"142":{"comment":"\"この試合を見逃したことは次の完全試合が達成するまで晴らせない。前回の槇原氏の時と同じ6-0\""},"143":{"comment":"\" 完全試合も凄いけど、13者連続奪三振もとんでもない記録だと思う。NPBの80年の歴史で過去最高記録が「9」だったのに一気に4つも更新....\""},"144":{"comment":"\"まさに令和の怪物じゃ／捕手の子も含めてチートやんって言われるレベルｗ\""},"145":{"comment":"\"メジャー記録と照らしても13連続、計19の奪三振は異次元の所業。\""},"146":{"comment":"\"“1人のランナーも出さない完全試合は、平成6年に巨人の槙原寛己投手が達成して以来、28年ぶり16人目”\""},"147":{"comment":"\"マイライフスレかな？\""},"148":{"comment":"\"160が当たり前の時代くるのかな…来年あたり167とか投げてそう\""},"149":{"comment":"\"すげーわ\""},"150":{"comment":"\"漫画なら没になる投球内容。高校野球（甲子園）とかいう暗黒に飲まれなかったことと、三木谷王国や吉村帝国を回避して吉井の居る海浜幕張へ行けたことが大きいね。\""},"151":{"comment":"\"キャッチャーの若さもまた物語性がある。\""},"152":{"comment":"\"27奪三振完全試合への夢が膨らむ\""},"153":{"comment":"\"これだけ三振を取りながら球数が嵩んでなくて素晴らしい。20歳と18歳のバッテリーが成し遂げるとは。佐々木朗希、今後もまたノーノー完全をやりかねなくてすごい\""},"154":{"comment":"\"過保護とか言われてたが正解だったな\""},"155":{"comment":"\"完全試合達成はエラーによる出塁も許されない。後半は守ってる野手陣もさぞ緊張しただろう\""},"156":{"comment":"\"“平成6年に巨人の槙原寛己投手が達成して以来” そういえば昔見たなと思い出した場面がまさに直近の記録だった。記録の凄さを理解した。\""},"157":{"comment":"\"まさに令和の怪物だ\""},"158":{"comment":"\"投手としては、大谷以上かも。怪物の大谷を上回る素材が出てくるとは思わなかった。ただし早熟ではない。大リーグで活躍してほしいが、１年目は出場しなかったので、大リーグ行きは遅れる。早めに高く売れないかな。\""},"159":{"comment":"\"マジで文句なしにプロ野球史上最高のピッチングで、これ以上の投球内容は50年や100年くらいじゃ出てこないかもしれない。凄すぎる。\""},"160":{"comment":"\"めちゃくちゃすごい、こんなの相手チームファンでも見に行ってよかったってなるレベル。\""},"161":{"comment":"\"すごいすごい！！！\""},"162":{"comment":"\"野手クソ暇やったやろなぁ\""},"163":{"comment":"\"よく分からんからガンダムに例えてくれ\""},"164":{"comment":"\"すごい\""},"165":{"comment":"\"故障せずにプロでピークを迎えられて良かったね。これからも故障に気をつけて頑張って下さい。\""},"166":{"comment":"\"「キャッチャーがルーキー」というのを称えると玄人っぽい感じがする。\""},"167":{"comment":"\"20歳と18歳のバッテリー！！若い人の活躍はうれしいねぇ。\""},"168":{"comment":"\"ハイライト（パ・リーグＴＶ公式） https://www.youtube.com/watch?v=EMaowebuyLM マリーンズもバファローズもユニフォームの上が黒、下が白なので注意w\""},"169":{"comment":"\"9回ショートゴロで藤岡が下がって捕ってかなりガチガチに見えた\""},"170":{"comment":"\"アンガールズの佐々木希すげー\""},"171":{"comment":"\"味方強すぎてやることねえわ、がリアルスポーツでもあるんだ……\""},"172":{"comment":"\"ストレートが10kmくらい早い大魔神が9イニング続けて出てくるとこうなるのか、という感じ。\""},"173":{"comment":"\"「ロッテの佐々木朗希投手が10日、千葉市で行われたオリックス戦で28年ぶり16人目となる完全試合を達成」「13者連続で三振を奪い、プロ野球記録を64年ぶりに更新」←すごいな。/ロッテのホームゲームだったんだ。\""},"174":{"comment":"\"まちがってここに完全試合に対するコメントを書いてしまったので移動させた。クレバーがセンターフライで連続三振を止めた時、オリファンは「実質勝ち」と言っていた。\""},"175":{"comment":"\"オリックスは基本的に貧打だけど吉田正尚だけは違うので完全に抑えるのは凄いな\""},"176":{"comment":"\"よし！メジャーいこう！（）\""},"177":{"comment":"\"佐々木希さんおめでとう\""},"178":{"comment":"\"はてブのタイトルが古いけど13連続奪三振を経て完全試合達成しました。すごすぎ\""},"179":{"comment":"\"おめでとう。素晴らしい記録。\""},"180":{"comment":"\"これが令和版の怪物か…エグいわ\""},"181":{"comment":"\"まーた若者の人間離れか\""},"182":{"comment":"\"一プロ野球ファンとして本当に嬉しいしおめでたい。最高のピッチングだった！\""},"183":{"comment":"\"こいつはやべえ／ロッテのじっくり育成、大成功。しかしすごいピッチャーだ／S-PARKで全アウト見たけどうわーえげつない。2年連続首位打者吉田も居るのにみんなぐるぐる三振。\""},"184":{"comment":"\"高卒ドライチ3年目と1年目のバッテリーで13連続奪三振＆19奪三振しての完全試合とか贔屓に居たら興奮しすぎて夜しか眠れなくなるわ\""},"185":{"comment":"\"「これまでの連続奪三振のプロ野球記録は、昭和32年7月に当時阪急の梶本隆夫投手、また、昭和33年5月に当時東映の土橋正幸投手がマークした9連続奪三振で、佐々木投手はこの記録を64年ぶりに更新しました。」\""},"186":{"comment":"\"大谷翔平みたいになるかな\""},"187":{"comment":"\"槇原以降出てなかったんだなぁ。奪三振19取ってるのに、9回投げて105球というのも凄い\""},"188":{"comment":"\"これはすごい。\""},"189":{"comment":"\"これだけの三振を奪って球数が少ないのが彼の凄さ。オープン戦はゾーンに嫌われたこともあったが、そこから制球を上げるよう修正したのが素晴らしい。というか投げるたびに良くなってる\""},"190":{"comment":"\"ほとんどストレートとフォークという、クローザーのような投球を９イニング続けながらの完全試合。これでもまだ素材の段階だと思う。完投もプロで初めてらしい。この間まで高校生だった捕手も褒めてほしい。\""},"191":{"comment":"\"本人の努力もありつつ、吉井コーチのお手柄だと思う／相手のオリックスは昨年の優勝チームだぜ\""},"192":{"comment":"\"誤爆で佐々木希がTwitterでトレンド入り\""},"193":{"comment":"\"高卒3年目の佐々木\u0026高卒1年目の松川バッテリーで完全試合。佐々木は「松川を信じて投げました」「松川がいいリードをしてくれた」と高卒ルーキーの女房役を称えた。 https://news.livedoor.com/article/detail/21980541/ 泣ける\""},"194":{"comment":"\"てことは2回分はピッチャーキャッチャー2人だけでやってもよかったって、、、コト、、、？！\""},"195":{"comment":"\" すごい\""},"196":{"comment":"\"昨年の首位チームに対して19奪三振で完全試合達成。20歳にして平成～令和にかけての最高のピッチングだよ\""},"197":{"comment":"\"パ・リーグTVで投球を見たけど、ストレートは160kmオーバー、フォークは140kmオーバーで鋭く落ちるというエグさ(；´Д｀)奪三振は記録タイの19、連続奪三振は9→13に更新、さらに完全試合。3年目についに完成した感。\""},"198":{"comment":"\"槙原以来28年ぶり、キャッチャーの松川選手は高卒ルーキー出場7試合目にしてこの大記録はすごいなぁ\""},"199":{"comment":"\"クソ打低の春のパリーグだとしてもとんでもない。去年の首位打者、吉田正尚から3打席連続三振はヤバい。2年続けてシーズンで30三振以下のバッターなんだから。リードしたルーキー松川も普通にヤバい。語彙力\""},"200":{"comment":"\"宇宙の　法則が　乱れる！/オープン戦のときからすごいことになりそうとワクワクしてたけど、ここまでとは。\""},"201":{"comment":"\"佐々木もすごい。高卒ルーキー松川くんの胆力もすごい。全てがすごい。\""},"202":{"comment":"\"凄い！デグロムが日本に来たらこんな感じなのかな。投球数も105球と、交代の目安とされる100球前後。\""},"203":{"comment":"\"千葉にロッテマリーンズという球団があることだけでも覚えて帰ってつかぁさい\""},"204":{"comment":"\"物凄いポテンシャルはあったが、こんなに早く、こんなに素晴らしい記録がついてくるとは思っていなかった　おめでとう🎉\""},"205":{"comment":"\"今どきの野球では信じられない結果。すごい。\""},"206":{"comment":"\"完全なるんほー\""},"207":{"comment":"\"ただの完全試合じゃなくて19奪三振の日本タイ記録と13連続奪三振という日本新記録も達成だからな。完全試合がヤバすぎて他の記録が霞むレベルだがこんなんチートすぎてオリックスが気の毒なレベル。\""},"208":{"comment":"\"ロッテ×オリックスという、地上波どころかBS/CSでも中継されてないというもったいなさ……今夜のプロ野球ニュースは録画しとくべきだなあ。\""},"209":{"comment":"\"“去年より体重が5キロ増えた”筋骨が5キロ増えたにしよう(´･_･`)\""},"210":{"comment":"\"13連続三振、トータル19三振。164km/h　\u003e\u003e平成6年に巨人の槙原寛己投手が達成して以来、28年ぶり16人目\""},"211":{"comment":"\"更新のしかたがやばい。9 から一気に 13 って\""}},"translations":{},"overview":"佐々木朗希投手の成長と完全試合達成に関する議論は、彼の卓越したパフォーマンスとそれを支える指導者の重要性に焦点を当てています（クラスター0, 2, 3, 6, 7）。岩手県出身の選手たちの活躍が地域の誇りとして称賛され（クラスター1）、オリックス打線の不調やコロナ禍の影響も議論の一部となっています（クラスター4）。全体として、佐々木投手の偉業とその将来性に対する期待が強調され、彼のメジャーリーグ挑戦への期待も高まっています（クラスター5）。","config":{"name":"「ロッテ佐々木朗希が完全試合達成 28年ぶり16人目 | NHK」に対する反応","question":"人々はロッテ佐々木朗希選手の完全試合達成にどのように反応したか","input":"example-sasaki","model":"gpt-4o","translation":{"model":"gpt-4","languages":[],"flags":[],"source_code":"import json\nfrom tqdm import tqdm\nimport pandas as pd\nfrom langchain.chat_models import ChatOpenAI\nfrom utils import messages, t\nfrom langchain.schema import AIMessage\nimport pandas as pd\nimport json\nfrom tqdm import tqdm\n\ndef translation(config):\n\n    dataset = config['output_dir']\n    path = f\"outputs/{dataset}/translations.json\"\n    results = {}\n\n    languages = list(config.get('translation', {}).get('languages', []))\n    if len(languages) == 0:\n        print(\"No languages specified. Skipping translation step.\")\n        # creating an empty file any, to reduce special casing later\n        with open(path, 'w') as file:\n            json.dump(results, file, indent=2)\n        return\n\n    arguments = pd.read_csv(f\"outputs/{dataset}/args.csv\")\n    labels = pd.read_csv(f\"outputs/{dataset}/labels.csv\")\n    takeaways = pd.read_csv(f\"outputs/{dataset}/takeaways.csv\")\n    with open(f\"outputs/{dataset}/overview.txt\") as f:\n        overview = f.read()\n\n    UI_copy = [t(\"Argument\"), t(\"Original comment\"), t(\"Representative arguments\"),\n               t(\"Open full-screen map\"), t(\"Back to report\"), t(\"Hide labels\"), t(\"Show labels\"),\n               t(\"Show filters\"), t(\"Hide filters\"), t(\"Min. votes\"), t(\"Consensus\"),\n               t(\"Showing\"), t(\"arguments\"), t(\"Reset zoom\"), t(\"Click anywhere on the map to close this\"),\n               t(\"Click on the dot for details\"), t(\"agree\"), t(\"disagree\"), t(\"Language\"),\n               t(\"English\"), t(\"arguments\"), t(\"of total\"), t(\"Overview\"), t(\"Cluster analysis\"),\n               t(\"Representative comments\"), t(\"Introduction\"), t(\"Clusters\"), t(\"Appendix\"),\n               t(\"This report was generated using an AI pipeline that consists of the following steps\"),\n               t(\"Step\"), t(\"extraction\"), t(\"show code\"), t(\"hide code\"), t(\"show prompt\"),\n               t(\"hide prompt\"), t(\"embedding\"), t(\"clustering\"), t(\"labelling\"), t(\"takeaways\"),\n               t(\"overview\")]\n\n    arg_list = arguments['argument'].to_list() + \\\n        labels['label'].to_list() + \\\n        UI_copy + \\\n        languages\n\n    if 'name' in config:\n        arg_list.append(config['name'])\n    if 'question' in config:\n        arg_list.append(config['question'])\n\n    prompt_file = config.get('translation_prompt', 'default')\n    with open(f\"prompts/translation/{prompt_file}.txt\") as f:\n        prompt = f.read()\n    model = config['model']\n\n    config['translation_prompt'] = prompt\n\n    translations = [translate_lang(\n        arg_list, 10, prompt, lang, model) for lang in languages]\n\n    # handling long takeaways differently, WITHOUT batching too much\n    long_arg_list = takeaways['takeaways'].to_list()\n    long_arg_list.append(overview)\n    if 'intro' in config:\n        long_arg_list.append(config['intro'])\n\n    long_translations = [translate_lang(\n        long_arg_list, 1, prompt, lang, model) for lang in languages]\n\n    for i, id in enumerate(arg_list):\n        print('i, id', i, id)\n        results[str(id)] = list([t[i] for t in translations])\n    for i, id in enumerate(long_arg_list):\n        results[str(id)] = list([t[i] for t in long_translations])\n\n    with open(path, 'w') as file:\n        json.dump(results, file, indent=2)\n\n\ndef translate_lang(arg_list, batch_size, prompt, lang, model):\n    translations = []\n    lang_prompt = prompt.replace(\"{language}\", lang)\n    print(f\"Translating to {lang}...\")\n    for i in tqdm(range(0, len(arg_list), batch_size)):\n        batch = arg_list[i: i + batch_size]\n        translations.extend(translate_batch(batch, lang_prompt, model))\n    return translations\n\n\ndef translate_batch(batch, lang_prompt, model, retries=3):\n    llm = ChatOpenAI(model_name=model, temperature=0.0)\n    input = json.dumps(list(batch))\n    response = llm(messages=messages(lang_prompt, input)).content.strip()\n    if \"```\" in response:\n        response = response.split(\"```\")[1]\n    if response.startswith(\"json\"):\n        response = response[4:]\n    try:\n        parsed = [a.strip() for a in json.loads(response)]\n        if len(parsed) != len(batch):\n            print(\"Warning: batch size mismatch!\")\n            print(\"Batch len:\", len(batch))\n            print(\"Response len:\", len(parsed))\n            for i, item in enumerate(batch):\n                print(f\"Batch item {i}:\", item)\n                if (i \u003c len(parsed)):\n                    print(\"Response:\", parsed[i])\n            if (len(batch) \u003e 1):\n                print(\"Retrying with smaller batches...\")\n                mid = len(batch) // 2\n                return translate_batch(batch[:mid], lang_prompt, model, retries - 1) + \\\n                    translate_batch(\n                        batch[mid:], lang_prompt, model, retries - 1)\n            else:\n                print(\"Retrying batch...\")\n                return translate_batch(batch, lang_prompt, model, retries - 1)\n        else:\n            return parsed\n    except json.decoder.JSONDecodeError as e:\n        print(\"JSON error:\", e)\n        print(\"Response was:\", response)\n        if retries \u003e 0:\n            print(\"Retrying batch...\")\n            return translate_batch(batch, lang_prompt, model, retries - 1)\n        else:\n            raise e","prompt":"/system \n\nあなたはプロの翻訳者です。\n日本語で書かれた単語と文章のリストを受け取ります。\n同じリストを同じ順番で、{language}に翻訳して返してください。\n元のリストと同じ長さの文字列の有効なJSONリストを返すようにしてください。"},"intro":"このAIが作成したレポートは、はてなブックマークのブックマークコメントのデータに依拠している。","output_dir":"example-sasaki","previous":{"name":"「ロッテ佐々木朗希が完全試合達成 28年ぶり16人目 | NHK」に対する反応","question":"人々はロッテ佐々木朗希選手の完全試合達成にどのように反応したか","input":"example-sasaki","model":"gpt-4o","extraction":{"workers":3,"limit":12,"source_code":"import os\nimport json\nfrom tqdm import tqdm\nimport pandas as pd\nfrom langchain.chat_models import ChatOpenAI\nfrom utils import messages, update_progress\nimport concurrent.futures\n\n\ndef extraction(config):\n    dataset = config['output_dir']\n    path = f\"outputs/{dataset}/args.csv\"\n    comments = pd.read_csv(f\"inputs/{config['input']}.csv\")\n\n    model = config['extraction']['model']\n    prompt = config['extraction']['prompt']\n    workers = config['extraction']['workers']\n    limit = config['extraction']['limit']\n\n    comment_ids = (comments['comment-id'].values)[:limit]\n    comments.set_index('comment-id', inplace=True)\n    results = pd.DataFrame()\n    update_progress(config, total=len(comment_ids))\n    for i in tqdm(range(0, len(comment_ids), workers)):\n        batch = comment_ids[i: i + workers]\n        batch_inputs = [comments.loc[id]['comment-body'] for id in batch]\n        batch_results = extract_batch(batch_inputs, prompt, model, workers)\n        for comment_id, extracted_args in zip(batch, batch_results):\n            for j, arg in enumerate(extracted_args):\n                new_row = {\"arg-id\": f\"A{comment_id}_{j}\",\n                           \"comment-id\": int(comment_id), \"argument\": arg}\n                results = pd.concat(\n                    [results, pd.DataFrame([new_row])], ignore_index=True)\n        update_progress(config, incr=len(batch))\n    results.to_csv(path, index=False)\n\n\ndef extract_batch(batch, prompt, model, workers):\n    with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as executor:\n        futures = [executor.submit(\n            extract_arguments, input, prompt, model) for input in list(batch)]\n        concurrent.futures.wait(futures)\n        return [future.result() for future in futures]\n\n\ndef extract_arguments(input, prompt, model, retries=3):\n    llm = ChatOpenAI(model_name=model, temperature=0.0)\n    response = llm(messages=messages(prompt, input)).content.strip()\n    try:\n        obj = json.loads(response)\n        # LLM sometimes returns valid JSON string\n        if isinstance(obj, str):\n            obj = [obj]\n        items = [a.strip() for a in obj]\n        items = filter(None, items)  # omit empty strings\n        return items\n    except json.decoder.JSONDecodeError as e:\n        print(\"JSON error:\", e)\n        print(\"Input was:\", input)\n        print(\"Response was:\", response)\n        if retries \u003e 0:\n            print(\"Retrying...\")\n            return extract_arguments(input, prompt, model, retries - 1)\n        else:\n            print(\"Silently giving up on trying to generate valid list.\")\n            return []\n","prompt":"/system\n\n\nあなたはプロのリサーチ・アシスタントで、私の仕事を手伝うことです。\n私の仕事は、論点を整理したきれいなデータセットを作成することです。\n\n背景は、私の上司が日本の都知事選挙に立候補したということです。\nこれから、出馬に関しての記事に一般から寄せられたコメントの例を挙げます。\nより簡潔で読みやすいものにするのを手伝ってほしい。\n本当に必要な場合は、2つの別々の議論に分けることもできるが、1つの議論を返すのが最善であることが多いだろう。\n\n結果は、きちんとフォーマットされた文字列形式（strings）のJSONリストとして返してください。\n\n\n/human\n\nAI技術は、そのライフサイクルにおける環境負荷の低減に重点を置いて開発されるべきである。\n\n/ai \n\n[\n  \"私たちは、AI技術が環境に与える影響の軽減に焦点を当てるべきである\"\n]\n\n/human \n\nAIの能力、限界、倫理的配慮について一般の人々を教育するための協調的な努力が必要である。\n\n/ai \n\n[\n  \"AIの能力について一般の人々を教育すべきである。\",\n  \"AIの限界と倫理的配慮について、一般の人々を教育すべきである。\"\n]\n\n/human \n\nAIは、エネルギー効率と居住者のウェルビーイングのためにスマートホームやビルを最適化することができる。\n\n/ ai \n\n[\n  \"AIは、エネルギー効率と居住者のウェルビーイングのためにスマートホームやビルを最適化することができる。\"\n]\n\n/human \n\nAIはエネルギー・グリッドを最適化し、無駄と二酸化炭素排出を削減するのに役立つ。\n\n/ai \n\n[\n  \"AIはエネルギー網を最適化し、無駄と二酸化炭素排出を削減することができる。\"\n]\n","model":"gpt-4o"},"clustering":{"clusters":3,"source_code":"\"\"\"Cluster the arguments using UMAP + HDBSCAN and GPT-4.\"\"\"\n\nimport pandas as pd\nimport numpy as np\nfrom importlib import import_module\n\n\ndef clustering(config):\n    dataset = config['output_dir']\n    path = f\"outputs/{dataset}/clusters.csv\"\n    arguments_df = pd.read_csv(f\"outputs/{dataset}/args.csv\")\n    arguments_array = arguments_df[\"argument\"].values\n\n    embeddings_df = pd.read_pickle(f\"outputs/{dataset}/embeddings.pkl\")\n    embeddings_array = np.asarray(embeddings_df[\"embedding\"].values.tolist())\n    clusters = config['clustering']['clusters']\n\n    result = cluster_embeddings(\n        docs=arguments_array,\n        embeddings=embeddings_array,\n        metadatas={\n            \"arg-id\": arguments_df[\"arg-id\"].values,\n            \"comment-id\": arguments_df[\"comment-id\"].values,\n        },\n        n_topics=clusters,\n    )\n    result.to_csv(path, index=False)\n\n\ndef cluster_embeddings(\n    docs,\n    embeddings,\n    metadatas,\n    min_cluster_size=2,\n    n_components=2,\n    n_topics=6,\n):\n    # (!) we import the following modules dynamically for a reason\n    # (they are slow to load and not required for all pipelines)\n    SpectralClustering = import_module('sklearn.cluster').SpectralClustering\n    stopwords = import_module('nltk.corpus').stopwords\n    HDBSCAN = import_module('hdbscan').HDBSCAN\n    UMAP = import_module('umap').UMAP\n    CountVectorizer = import_module(\n        'sklearn.feature_extraction.text').CountVectorizer\n    BERTopic = import_module('bertopic').BERTopic\n\n    umap_model = UMAP(\n        random_state=42,\n        n_components=n_components,\n    )\n    hdbscan_model = HDBSCAN(min_cluster_size=min_cluster_size)\n\n    stop = stopwords.words(\"english\")\n    vectorizer_model = CountVectorizer(stop_words=stop)\n    topic_model = BERTopic(\n        umap_model=umap_model,\n        hdbscan_model=hdbscan_model,\n        vectorizer_model=vectorizer_model,\n        verbose=True,\n    )\n\n    # Fit the topic model.\n    _, __ = topic_model.fit_transform(docs, embeddings=embeddings)\n\n    n_samples = len(embeddings)\n    n_neighbors = min(n_samples - 1, 10)\n    spectral_model = SpectralClustering(\n        n_clusters=n_topics,\n        affinity=\"nearest_neighbors\",\n        n_neighbors=n_neighbors,  # Use the modified n_neighbors\n        random_state=42\n    )\n    umap_embeds = umap_model.fit_transform(embeddings)\n    cluster_labels = spectral_model.fit_predict(umap_embeds)\n\n    result = topic_model.get_document_info(\n        docs=docs,\n        metadata={\n            **metadatas,\n            \"x\": umap_embeds[:, 0],\n            \"y\": umap_embeds[:, 1],\n        },\n    )\n\n    result.columns = [c.lower() for c in result.columns]\n    result = result[['arg-id', 'x', 'y', 'probability']]\n    result['cluster-id'] = cluster_labels\n\n    return result\n"},"translation":{"model":"gpt-4","languages":[],"flags":[],"source_code":"import json\nfrom tqdm import tqdm\nimport pandas as pd\nfrom langchain.chat_models import ChatOpenAI\nfrom utils import messages, t\nfrom langchain.schema import AIMessage\nimport pandas as pd\nimport json\nfrom tqdm import tqdm\n\ndef translation(config):\n\n    dataset = config['output_dir']\n    path = f\"outputs/{dataset}/translations.json\"\n    results = {}\n\n    languages = list(config.get('translation', {}).get('languages', []))\n    if len(languages) == 0:\n        print(\"No languages specified. Skipping translation step.\")\n        # creating an empty file any, to reduce special casing later\n        with open(path, 'w') as file:\n            json.dump(results, file, indent=2)\n        return\n\n    arguments = pd.read_csv(f\"outputs/{dataset}/args.csv\")\n    labels = pd.read_csv(f\"outputs/{dataset}/labels.csv\")\n    takeaways = pd.read_csv(f\"outputs/{dataset}/takeaways.csv\")\n    with open(f\"outputs/{dataset}/overview.txt\") as f:\n        overview = f.read()\n\n    UI_copy = [t(\"Argument\"), t(\"Original comment\"), t(\"Representative arguments\"),\n               t(\"Open full-screen map\"), t(\"Back to report\"), t(\"Hide labels\"), t(\"Show labels\"),\n               t(\"Show filters\"), t(\"Hide filters\"), t(\"Min. votes\"), t(\"Consensus\"),\n               t(\"Showing\"), t(\"arguments\"), t(\"Reset zoom\"), t(\"Click anywhere on the map to close this\"),\n               t(\"Click on the dot for details\"), t(\"agree\"), t(\"disagree\"), t(\"Language\"),\n               t(\"English\"), t(\"arguments\"), t(\"of total\"), t(\"Overview\"), t(\"Cluster analysis\"),\n               t(\"Representative comments\"), t(\"Introduction\"), t(\"Clusters\"), t(\"Appendix\"),\n               t(\"This report was generated using an AI pipeline that consists of the following steps\"),\n               t(\"Step\"), t(\"extraction\"), t(\"show code\"), t(\"hide code\"), t(\"show prompt\"),\n               t(\"hide prompt\"), t(\"embedding\"), t(\"clustering\"), t(\"labelling\"), t(\"takeaways\"),\n               t(\"overview\")]\n\n    arg_list = arguments['argument'].to_list() + \\\n        labels['label'].to_list() + \\\n        UI_copy + \\\n        languages\n\n    if 'name' in config:\n        arg_list.append(config['name'])\n    if 'question' in config:\n        arg_list.append(config['question'])\n\n    prompt_file = config.get('translation_prompt', 'default')\n    with open(f\"prompts/translation/{prompt_file}.txt\") as f:\n        prompt = f.read()\n    model = config['model']\n\n    config['translation_prompt'] = prompt\n\n    translations = [translate_lang(\n        arg_list, 10, prompt, lang, model) for lang in languages]\n\n    # handling long takeaways differently, WITHOUT batching too much\n    long_arg_list = takeaways['takeaways'].to_list()\n    long_arg_list.append(overview)\n    if 'intro' in config:\n        long_arg_list.append(config['intro'])\n\n    long_translations = [translate_lang(\n        long_arg_list, 1, prompt, lang, model) for lang in languages]\n\n    for i, id in enumerate(arg_list):\n        print('i, id', i, id)\n        results[str(id)] = list([t[i] for t in translations])\n    for i, id in enumerate(long_arg_list):\n        results[str(id)] = list([t[i] for t in long_translations])\n\n    with open(path, 'w') as file:\n        json.dump(results, file, indent=2)\n\n\ndef translate_lang(arg_list, batch_size, prompt, lang, model):\n    translations = []\n    lang_prompt = prompt.replace(\"{language}\", lang)\n    print(f\"Translating to {lang}...\")\n    for i in tqdm(range(0, len(arg_list), batch_size)):\n        batch = arg_list[i: i + batch_size]\n        translations.extend(translate_batch(batch, lang_prompt, model))\n    return translations\n\n\ndef translate_batch(batch, lang_prompt, model, retries=3):\n    llm = ChatOpenAI(model_name=model, temperature=0.0)\n    input = json.dumps(list(batch))\n    response = llm(messages=messages(lang_prompt, input)).content.strip()\n    if \"```\" in response:\n        response = response.split(\"```\")[1]\n    if response.startswith(\"json\"):\n        response = response[4:]\n    try:\n        parsed = [a.strip() for a in json.loads(response)]\n        if len(parsed) != len(batch):\n            print(\"Warning: batch size mismatch!\")\n            print(\"Batch len:\", len(batch))\n            print(\"Response len:\", len(parsed))\n            for i, item in enumerate(batch):\n                print(f\"Batch item {i}:\", item)\n                if (i \u003c len(parsed)):\n                    print(\"Response:\", parsed[i])\n            if (len(batch) \u003e 1):\n                print(\"Retrying with smaller batches...\")\n                mid = len(batch) // 2\n                return translate_batch(batch[:mid], lang_prompt, model, retries - 1) + \\\n                    translate_batch(\n                        batch[mid:], lang_prompt, model, retries - 1)\n            else:\n                print(\"Retrying batch...\")\n                return translate_batch(batch, lang_prompt, model, retries - 1)\n        else:\n            return parsed\n    except json.decoder.JSONDecodeError as e:\n        print(\"JSON error:\", e)\n        print(\"Response was:\", response)\n        if retries \u003e 0:\n            print(\"Retrying batch...\")\n            return translate_batch(batch, lang_prompt, model, retries - 1)\n        else:\n            raise e","prompt":"/system \n\nあなたはプロの翻訳者です。\n日本語で書かれた単語と文章のリストを受け取ります。\n同じリストを同じ順番で、{language}に翻訳して返してください。\n元のリストと同じ長さの文字列の有効なJSONリストを返すようにしてください。"},"intro":"このAIが作成したレポートは、はてなブックマークのブックマークコメントのデータに依拠している。","output_dir":"example-sasaki","embedding":{"source_code":"\nfrom langchain.embeddings import OpenAIEmbeddings\nimport pandas as pd\nfrom tqdm import tqdm\n\n\ndef embedding(config):\n    dataset = config['output_dir']\n    path = f\"outputs/{dataset}/embeddings.pkl\"\n    arguments = pd.read_csv(f\"outputs/{dataset}/args.csv\")\n    embeddings = []\n    for i in tqdm(range(0, len(arguments), 1000)):\n        args = arguments[\"argument\"].tolist()[i: i + 1000]\n        embeds = OpenAIEmbeddings().embed_documents(args)\n        embeddings.extend(embeds)\n    df = pd.DataFrame(\n        [\n            {\"arg-id\": arguments.iloc[i][\"arg-id\"], \"embedding\": e}\n            for i, e in enumerate(embeddings)\n        ]\n    )\n    df.to_pickle(path)\n"},"labelling":{"sample_size":30,"source_code":"\"\"\"Create labels for the clusters.\"\"\"\n\nfrom tqdm import tqdm\nfrom typing import List\nimport numpy as np\nimport pandas as pd\nfrom langchain.chat_models import ChatOpenAI\nfrom utils import messages, update_progress\n\n\ndef labelling(config):\n    dataset = config['output_dir']\n    path = f\"outputs/{dataset}/labels.csv\"\n\n    arguments = pd.read_csv(f\"outputs/{dataset}/args.csv\")\n    clusters = pd.read_csv(f\"outputs/{dataset}/clusters.csv\")\n\n    results = pd.DataFrame()\n\n    sample_size = config['labelling']['sample_size']\n    prompt = config['labelling']['prompt']\n    model = config['labelling']['model']\n\n    question = config['question']\n    cluster_ids = clusters['cluster-id'].unique()\n\n    update_progress(config, total=len(cluster_ids))\n\n    for _, cluster_id in tqdm(enumerate(cluster_ids), total=len(cluster_ids)):\n        args_ids = clusters[clusters['cluster-id']\n                            == cluster_id]['arg-id'].values\n        args_ids = np.random.choice(args_ids, size=min(\n            len(args_ids), sample_size), replace=False)\n        args_sample = arguments[arguments['arg-id']\n                                .isin(args_ids)]['argument'].values\n\n        args_ids_outside = clusters[clusters['cluster-id']\n                                    != cluster_id]['arg-id'].values\n        args_ids_outside = np.random.choice(args_ids_outside, size=min(\n            len(args_ids_outside), sample_size), replace=False)\n        args_sample_outside = arguments[arguments['arg-id']\n                                        .isin(args_ids_outside)]['argument'].values\n\n        label = generate_label(question, args_sample,\n                               args_sample_outside, prompt, model)\n        results = pd.concat([results, pd.DataFrame(\n            [{'cluster-id': cluster_id, 'label': label}])], ignore_index=True)\n        update_progress(config, incr=1)\n\n    results.to_csv(path, index=False)\n\n\ndef generate_label(question, args_sample, args_sample_outside, prompt, model):\n    llm = ChatOpenAI(model_name=model, temperature=0.0)\n    outside = '\\n * ' + '\\n * '.join(args_sample_outside)\n    inside = '\\n * ' + '\\n * '.join(args_sample)\n    input = f\"Question of the consultation:{question}\\n\\n\" + \\\n        f\"Examples of arguments OUTSIDE the cluster:\\n {outside}\" + \\\n        f\"Examples of arguments INSIDE the cluster:\\n {inside}\"\n    response = llm(messages=messages(prompt, input)).content.strip()\n    return response\n","prompt":"/system \n\nあなたは、より広範なコンサルテーション内の一連の議論に対するカテゴリラベルを生成するカテゴリラベリングアシスタントです。あなたには、相談の主な質問、クラスタ内の議論のリスト、およびこのクラスタ外の議論のリストが与えられます。あなたはクラスターを要約する1つのカテゴリーラベルで回答します。\n\nあなたは、より広範なコンサルテーション内の一連の議論に対するカテゴリラベルを生成するカテゴリラベリングアシスタントです。あなたには、相談の主な質問、クラスタ内の議論のリスト、およびこのクラスタ外の議論のリストが与えられます。あなたはクラスターを要約する1つのカテゴリーラベルで回答します。\n\nラベルは非常に簡潔でなければならず、クラスターとその外側にある論点を区別するのに十分な正確さでなければならない。\n\n/human\n\nコンサルテーションの質問 「英国のEU離脱決定の影響は何だと思いますか？\n\n関心のあるクラスター以外の論点の例\n\n * エラスムス・プログラムからの除外により、教育・文化交流の機会が制限された。\n * 英国は、国境検問の強化による旅行時間の延長に対処し、通勤客や旅行客に影響を与えた。\n * 環境基準における協力が減少し、気候変動と闘う努力が妨げられた。\n * 相互医療協定の中断により、患者ケアに課題を感じた。\n * Brexit関連の変更により、家族の居住権や市民権の申請が複雑になった。\n * 英国は、共同研究機会の減少により、研究の課題に取り組む世界的な取り組みに支障をきたすことを目の当たりにした。\n * EUの文化助成プログラムからの除外により、創造的なプロジェクトの制限に直面した。\n * 英国は、EUの資金提供の喪失により、慈善活動やコミュニティ支援の後退を目の当たりにした。\n * 消費者保護の弱体化により、国境を越えた紛争解決に課題が生じた。\n * 英国はプロの音楽家としてEU諸国をツアーする際の制限に直面し、キャリアに影響を与えた。\n\nクラスター内部での議論の例\n\n * Brexitによりサプライチェーンが混乱し、企業にとってコスト増と納期遅延につながった。\n * ブレグジットのため、市場の変動や投資・退職金の不確実性に直面した。\n * 新たな関税や通関手続きにより、英国は輸出業者として利益率の低下に対処した。\n * ブレグジット後、企業がEU市場内にとどまるために事業を移転したため、雇用を失った。\n * 英国は輸入品価格の高騰による生活費の増加に苦しんだ。\n * 英国のハイテク産業への投資が減少し、技術革新と雇用機会に影響を与えた。\n * 新たなビザ規制による観光客の減少を目の当たりにし、接客業に影響。\n * ポンド価値の下落により購買力が低下し、旅費が増加した。\n\n\n/ai \n\n財務上のマイナス影響","model":"gpt-4o"},"takeaways":{"sample_size":30,"source_code":"\"\"\"Create summaries for the clusters.\"\"\"\n\nfrom tqdm import tqdm\nimport os\nfrom typing import List\nimport numpy as np\nimport pandas as pd\nfrom langchain.chat_models import ChatOpenAI\nfrom utils import messages, update_progress\n\n\ndef takeaways(config):\n    dataset = config['output_dir']\n    path = f\"outputs/{dataset}/takeaways.csv\"\n\n    arguments = pd.read_csv(f\"outputs/{dataset}/args.csv\")\n    clusters = pd.read_csv(f\"outputs/{dataset}/clusters.csv\")\n\n    results = pd.DataFrame()\n\n    sample_size = config['takeaways']['sample_size']\n    prompt = config['takeaways']['prompt']\n    model = config['takeaways']['model']\n\n    model = config.get('model_takeaways', config.get('model', 'gpt3.5-turbo'))\n    cluster_ids = clusters['cluster-id'].unique()\n\n    update_progress(config, total=len(cluster_ids))\n\n    for _, cluster_id in tqdm(enumerate(cluster_ids), total=len(cluster_ids)):\n        args_ids = clusters[clusters['cluster-id']\n                            == cluster_id]['arg-id'].values\n        args_ids = np.random.choice(args_ids, size=min(\n            len(args_ids), sample_size), replace=False)\n        args_sample = arguments[arguments['arg-id']\n                                .isin(args_ids)]['argument'].values\n        label = generate_takeaways(args_sample, prompt, model)\n        results = pd.concat([results, pd.DataFrame(\n            [{'cluster-id': cluster_id, 'takeaways': label}])], ignore_index=True)\n        update_progress(config, incr=1)\n\n    results.to_csv(path, index=False)\n\n\ndef generate_takeaways(args_sample, prompt, model):\n    llm = ChatOpenAI(model_name=model, temperature=0.0)\n    input = \"\\n\".join(args_sample)\n    response = llm(messages=messages(prompt, input)).content.strip()\n    return response\n","prompt":"/system \n\nあなたはシンクタンクで働く専門家リサーチアシスタントです。あなたは、公開協議の際に参加者の一団から出された議論のリストを渡されます。あなたは、主な論点を
